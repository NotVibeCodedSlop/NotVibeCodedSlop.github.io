          <option value="date_desc" ${f.sort === 'date_desc' ? 'selected' : ''}>Date ↓</option>
          <option value="date_asc" ${f.sort === 'date_asc' ? 'selected' : ''}>Date ↑</option>
          <option value="views_desc" ${f.sort === 'views_desc' ? 'selected' : ''}>Views ↓</option>
          <option value="comments_desc" ${f.sort === 'comments_desc' ? 'selected' : ''}>Comments ↓</option>
        </select>
        ${selCount ? `
          <span class="badge accent">${selCount} selected</span>
          <select id="bulk-vis" class="sm">
            <option value="">Bulk Visibility (Buffered)...</option>
            <option value="public">Set Public</option>
            <option value="unlisted">Set Unlisted</option>
            <option value="private">Set Private</option>
          </select>
          <button class="sm" id="bulk-clear">Clear</button>
        ` : ''}
      </div>

      <div class="studio-table-wrap">
        <table class="studio-table">
          <thead>
            <tr>
              <th style="width:34px;"><input type="checkbox" id="chk-all" ${list.length && list.every(v => State.runtime.selectedVideoIds.has(v.id)) ? 'checked' : ''}></th>
              <th>Video</th>
              <th>Notices</th>
              <th>Visibility</th>
              <th class="sortable" data-sort="date">Date ${f.sort === 'date_desc' ? '↓' : f.sort === 'date_asc' ? '↑' : ''}</th>
              <th class="num-col sortable" data-sort="views">Views ${f.sort === 'views_desc' ? '↓' : ''}</th>
              <th class="num-col sortable" data-sort="comments">Comments ${f.sort === 'comments_desc' ? '↓' : ''}</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(v => {
              const checked = State.runtime.selectedVideoIds.has(v.id);
              const vis = v.status?.privacyStatus || 'private';
              const visIcon = vis === 'public' ? '🌐' : vis === 'unlisted' ? '🔗' : '🔒';
              const thumb = v.snippet?.thumbnails?.medium?.url || v.snippet?.thumbnails?.default?.url || '';
              return `
                <tr class="${checked ? 'selected-row' : ''}" data-vid="${esc(v.id)}">
                  <td><input type="checkbox" class="vid-chk" data-vid="${esc(v.id)}" ${checked ? 'checked' : ''}></td>
                  <td>
                    <div class="vid-cell">
                      <div class="thumb-box">
                        <img src="${esc(thumb)}" alt="" loading="lazy">
                        <span class="thumb-dur">${fmtDurationISO(v.contentDetails?.duration)}</span>
                      </div>
                      <div class="vid-meta">
                        <div class="vid-title" title="${esc(v.snippet?.title)}">${esc(v.snippet?.title)}</div>
                        <div class="vid-desc" title="${esc(v.snippet?.description)}">${esc(v.snippet?.description || '—')}</div>
                        <div class="row-actions">
                          <button class="sm" data-act="edit" data-vid="${esc(v.id)}">✏️ Details</button>
                          <button class="sm" data-act="analytics" data-vid="${esc(v.id)}">📊 Analytics</button>
                          <button class="sm" data-act="comments" data-vid="${esc(v.id)}">💬 Comments</button>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td class="small muted">${esc(getVideoNotices(v))}</td>
                  <td>${visIcon} ${esc(vis.charAt(0).toUpperCase() + vis.slice(1))}</td>
                  <td>
                    <div>${fmtDateShort(v.snippet?.publishedAt)}</div>
                    <div class="small muted">${vis === 'private' && v.status?.publishAt ? 'Scheduled' : 'Published'}</div>
                  </td>
                  <td class="num-col mono">${fmtNum(v.statistics?.viewCount)}</td>
                  <td class="num-col mono">${fmtNum(v.statistics?.commentCount)}</td>
                </tr>`;
            }).join('') || `<tr><td colspan="7" class="muted" style="padding:20px;text-align:center;">No videos match filter.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;

    el.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
      State.runtime.videoSubTab = b.dataset.sub;
      renderViewInto(el, pane, getActiveTab(pane));
    }));
    el.querySelector('#btn-sync-vids')?.addEventListener('click', async () => {
      try { await syncChannelAndVideos(true); renderViewInto(el, pane, getActiveTab(pane)); }
      catch (e) { toast(e.message, 'err'); }
    });
    el.querySelector('#vf-q')?.addEventListener('input', (e) => {
      State.runtime.videoFilter.q = e.target.value;
      renderViewInto(el, pane, getActiveTab(pane));
      const inp = el.querySelector('#vf-q');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    });
    el.querySelector('#vf-vis')?.addEventListener('change', (e) => {
      State.runtime.videoFilter.visibility = e.target.value;
      renderViewInto(el, pane, getActiveTab(pane));
    });
    el.querySelector('#vf-sort')?.addEventListener('change', (e) => {
      State.runtime.videoFilter.sort = e.target.value;
      renderViewInto(el, pane, getActiveTab(pane));
    });
    el.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
      const s = th.dataset.sort;
      if (s === 'date') State.runtime.videoFilter.sort = State.runtime.videoFilter.sort === 'date_desc' ? 'date_asc' : 'date_desc';
      if (s === 'views') State.runtime.videoFilter.sort = 'views_desc';
      if (s === 'comments') State.runtime.videoFilter.sort = 'comments_desc';
      renderViewInto(el, pane, getActiveTab(pane));
    }));
    el.querySelector('#chk-all')?.addEventListener('change', (e) => {
      list.forEach(v => e.target.checked ? State.runtime.selectedVideoIds.add(v.id) : State.runtime.selectedVideoIds.delete(v.id));
      renderViewInto(el, pane, getActiveTab(pane));
    });
    el.querySelectorAll('.vid-chk').forEach(c => c.addEventListener('change', (e) => {
      if (e.target.checked) State.runtime.selectedVideoIds.add(c.dataset.vid);
      else State.runtime.selectedVideoIds.delete(c.dataset.vid);
      renderViewInto(el, pane, getActiveTab(pane));
    }));
    el.querySelector('#bulk-clear')?.addEventListener('click', () => {
      State.runtime.selectedVideoIds.clear();
      renderViewInto(el, pane, getActiveTab(pane));
    });
    el.querySelector('#bulk-vis')?.addEventListener('change', (e) => {
      const val = e.target.value;
      if (!val) return;
      State.runtime.selectedVideoIds.forEach(vid => {
        enqueueWrite({ type: 'video.update', videoId: vid, statusPatch: { privacyStatus: val }, summary: `Set ${vid} -> ${val}` });
      });
      State.runtime.selectedVideoIds.clear();
      renderViewInto(el, pane, getActiveTab(pane));
    });
    el.querySelectorAll('[data-act="edit"]').forEach(b => b.addEventListener('click', (ev) => {
      const v = allVideos.find(x => x.id === b.dataset.vid);
      openViewInPane(pane.id, 'video_editor', { videoId: b.dataset.vid, title: 'Edit: ' + (v?.snippet?.title || '').slice(0, 18) }, ev.shiftKey);
    }));
    el.querySelectorAll('[data-act="analytics"]').forEach(b => b.addEventListener('click', (ev) => {
      openViewInPane(pane.id, 'analytics', { videoId: b.dataset.vid, title: 'Stats: ' + b.dataset.vid }, ev.shiftKey);
    }));
    el.querySelectorAll('[data-act="comments"]').forEach(b => b.addEventListener('click', (ev) => {
      State.runtime.commentFilter.mode = 'video';
      State.runtime.commentFilter.videoId = b.dataset.vid;
      openViewInPane(pane.id, 'comments', { videoId: b.dataset.vid, title: 'Comments: ' + b.dataset.vid }, ev.shiftKey);
    }));
  }

  /* ---------- PRESET COMPOSER HELPER WIDGET ---------- */
  function mountPresetWidget(container, onApply) {
    const presets = State.titlePresets || [];
    container.innerHTML = `
      <div class="card" style="background:var(--surface-2);">
        <div class="flex wrap" style="justify-content:space-between;margin-bottom:6px;">
          <strong>🪄 Title & Description Preset Generator</strong>
          <select id="pw-preset" class="sm">
            ${presets.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="small muted mono" id="pw-rule-preview" style="margin-bottom:8px;"></div>
        <div class="grid-2" style="gap:8px;">
          <div>
            <label class="small muted">Base Title (<code>%t</code>)</label>
            <input id="pw-title" style="width:100%;" placeholder="e.g. Steam Washing Machine">
          </div>
          <div>
            <label class="small muted">Extra Notes (<code>%d</code>, optional)</label>
            <input id="pw-desc" style="width:100%;" placeholder="Optional extra lines">
          </div>
        </div>
        <div id="pw-vars" class="grid-auto" style="margin-top:8px;"></div>
        <div class="flex wrap" style="margin-top:8px;">
          <button class="sm primary" id="pw-apply" type="button">Apply Preset → Title & Description</button>
          <span class="small muted">Tokens: <code>%t</code> title, <code>%s</code> split title/desc, <code>%d</code> notes, <code>$var</code> custom fields</span>
        </div>
      </div>
    `;

    const sel = container.querySelector('#pw-preset');
    const rulePrev = container.querySelector('#pw-rule-preview');
    const varsBox = container.querySelector('#pw-vars');

    function syncVars() {
      const p = presets.find(x => x.id === sel.value) || presets[0];
      if (!p) return;
      rulePrev.textContent = p.rule;
      const vars = extractPresetVars(p.rule);
      varsBox.innerHTML = vars.map(v => `
        <div>
          <label class="small muted"><code>$${esc(v)}</code></label>
          <input class="pw-var sm" data-var="${esc(v)}" style="width:100%;" placeholder="Enter $${esc(v)}...">
        </div>
      `).join('');
    }
    sel.addEventListener('change', syncVars);
    syncVars();

    container.querySelector('#pw-apply').addEventListener('click', () => {
      const p = presets.find(x => x.id === sel.value) || presets[0];
      if (!p) return;
      const varsMap = {};
      varsBox.querySelectorAll('.pw-var').forEach(inp => { varsMap[inp.dataset.var] = inp.value; });
      const chName = getChannelCache().channel?.snippet?.title || '';
      const result = applyTitleDescPreset(
        p.rule,
        container.querySelector('#pw-title').value,
        container.querySelector('#pw-desc').value,
        varsMap,
        chName
      );
      onApply({ ...result, preset: p });
    });
  }

  /* ---------- VIEW 3: VIDEO EDITOR + NANO BANANA 2 LITE THUMBNAIL ---------- */
  function renderVideoEditorView(el, pane, tab) {
    const cache = getChannelCache();
    const vidId = tab.params?.videoId || cache.videos[0]?.id;
    const video = cache.videos.find(v => v.id === vidId);
    if (!video) {
      el.innerHTML = '<div class="card">Select a video from the Videos tab to edit.</div>';
      return;
    }

    const thState = State.runtime.editorThumbs[vidId] || {
      frames: [video.snippet?.thumbnails?.high?.url || video.snippet?.thumbnails?.medium?.url].filter(Boolean),
      generated: null
    };
    State.runtime.editorThumbs[vidId] = thState;

    el.innerHTML = `
      <div class="flex wrap" style="justify-content:space-between;margin-bottom:10px;">
        <div>
          <h3 style="margin:0;">Editing: ${esc(video.snippet?.title)}</h3>
          <div class="small muted mono">ID: ${esc(video.id)} · Duration: ${fmtDurationISO(video.contentDetails?.duration)}</div>
        </div>
        <div class="flex wrap">
          <button class="sm" id="ve-open-stats">📊 Video Analytics</button>
          <button class="sm" id="ve-open-comments">💬 Comments</button>
          <button class="sm danger" id="ve-delete">🗑 Stage Delete</button>
        </div>
      </div>

      <div id="ve-preset-slot" style="margin-bottom:10px;"></div>

      <div class="grid-2">
        <div class="card flex-col">
          <strong>Metadata (Buffered via Write Queue)</strong>
          <label class="small muted">Title (<span id="ve-tlen">0</span>/100)</label>
          <input id="ve-title" value="${esc(video.snippet?.title || '')}">
          <label class="small muted">Description (<span id="ve-dlen">0</span>/5000 bytes)</label>
          <textarea id="ve-desc" rows="6">${esc(video.snippet?.description || '')}</textarea>
          <div class="grid-2" style="gap:8px;">
            <div>
              <label class="small muted">Visibility</label>
              <select id="ve-vis" style="width:100%;">
                <option value="public" ${video.status?.privacyStatus === 'public' ? 'selected' : ''}>Public</option>
                <option value="unlisted" ${video.status?.privacyStatus === 'unlisted' ? 'selected' : ''}>Unlisted</option>
                <option value="private" ${video.status?.privacyStatus === 'private' ? 'selected' : ''}>Private</option>
              </select>
            </div>
            <div>
              <label class="small muted">Category</label>
              <select id="ve-cat" style="width:100%;">
                ${YT_CATEGORIES.map(([cid, cname]) => `<option value="${cid}" ${String(video.snippet?.categoryId) === cid ? 'selected' : ''}>${esc(cname)}</option>`).join('')}
              </select>
            </div>
          </div>
          <label class="small muted">Tags (comma separated)</label>
          <input id="ve-tags" value="${esc((video.snippet?.tags || []).join(', '))}">
          <div class="grid-2" style="gap:8px;">
            <div>
              <label class="small muted">Schedule Publish (when Private)</label>
              <input type="datetime-local" id="ve-pubat" style="width:100%;" value="${video.status?.publishAt ? esc(new Date(video.status.publishAt).toISOString().slice(0, 16)) : ''}">
            </div>
            <div>
              <label class="small muted">License</label>
              <select id="ve-lic" style="width:100%;">
                <option value="youtube" ${(video.status?.license || 'youtube') === 'youtube' ? 'selected' : ''}>Standard YouTube License</option>
                <option value="creativeCommon" ${video.status?.license === 'creativeCommon' ? 'selected' : ''}>Creative Commons - Attribution</option>
              </select>
            </div>
          </div>
          <div class="flex wrap">
            <input id="ve-lang" class="sm" style="width:120px;" placeholder="Lang (e.g. en)" value="${esc(video.snippet?.defaultLanguage || '')}">
            <label class="flex small"><input type="checkbox" id="ve-embed" ${video.status?.embeddable !== false ? 'checked' : ''}> Allow Embed</label>
            <label class="flex small"><input type="checkbox" id="ve-stats" ${video.status?.publicStatsViewable !== false ? 'checked' : ''}> Public Stats</label>
            <label class="flex small"><input type="checkbox" id="ve-kids" ${video.status?.madeForKids || video.status?.selfDeclaredMadeForKids ? 'checked' : ''}> Made for Kids</label>
          </div>
          <div id="ve-issues" class="small" style="color:var(--danger);"></div>
          <div class="flex wrap">
            <button class="primary" id="ve-stage">📦 Stage Update to Write Buffer (Ctrl+Enter)</button>
            <select id="ve-pl-sel" class="sm">
              <option value="">Add to Playlist (Buffered)...</option>
              ${(cache.playlists || []).map(p => `<option value="${esc(p.id)}">${esc(p.snippet?.title)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="card flex-col">
          <strong>🍌 Thumbnail Studio (Gemini Nano Banana 2 Lite)</strong>
          <div class="small muted">Attach local source video or images to give Gemini real visual elements from the video (1 API call, High Thinking, 16:9).</div>
          <div class="flex wrap">
            <input type="file" id="ve-frame-vid" accept="video/*,image/*" class="sm" style="flex:1;">
          </div>
          <div class="frame-strip" id="ve-frames">
            ${thState.frames.map((src, i) => `
              <div class="frame-card selected" data-fidx="${i}">
                <img src="${esc(src)}" alt=""><span>Ref #${i + 1}</span>
              </div>`).join('')}
          </div>
          <label class="small muted">Extra Thumbnail Art Direction (optional)</label>
          <input id="ve-thumb-prompt" placeholder="e.g. high-contrast shocked reaction, dramatic red arrows, glowing CRT">
          <div class="flex wrap">
            <button class="primary" id="ve-gen-thumb">✨ Create Thumbnail (Nano Banana 2 Lite)</button>
          </div>
          <div id="ve-gen-preview" style="margin-top:6px;">
            ${thState.generated ? `
              <img src="${esc(thState.generated)}" style="width:100%;max-width:360px;border-radius:var(--radius-sm);border:1px solid var(--border);display:block;">
              <div class="flex wrap" style="margin-top:6px;">
                <button class="sm primary" id="ve-stage-thumb">📦 Stage Thumbnail to Write Buffer</button>
                <a class="btn sm" download="thumb_${esc(video.id)}.jpg" href="${esc(thState.generated)}">⬇ Download JPG</a>
              </div>` : '<div class="small muted">No generated thumbnail yet.</div>'}
          </div>
        </div>
      </div>
      <div class="card flex-col" style="margin-top:10px;">
        <div class="flex wrap" style="justify-content:space-between;">
          <strong>💬 Subtitles / Captions (.srt / .vtt)</strong>
          <button class="sm" id="ve-cap-list">↻ Load Captions (50u)</button>
        </div>
        <div class="flex wrap">
          <input id="ve-cap-lang" class="sm" value="en" placeholder="Lang (en, cs...)" style="width:90px;">
          <input id="ve-cap-name" class="sm" placeholder="Track name (e.g. English)" style="width:160px;">
          <input type="file" id="ve-cap-file" accept=".srt,.vtt,.sbv,.sub" class="sm" style="flex:1;">
          <button class="sm primary" id="ve-cap-up">⬆ Upload Caption (400u)</button>
        </div>
        <div id="ve-cap-out" class="small muted">Click Load Captions to inspect existing tracks for this video.</div>
      </div>
    `;

    mountPresetWidget(el.querySelector('#ve-preset-slot'), ({ title, description, preset }) => {
      el.querySelector('#ve-title').value = title;
      el.querySelector('#ve-desc').value = description;
      if (preset.defaultCategory) el.querySelector('#ve-cat').value = preset.defaultCategory;
      if (preset.defaultTags && !el.querySelector('#ve-tags').value.trim()) el.querySelector('#ve-tags').value = preset.defaultTags;
      updateCounts();
      toast('Applied preset into editor fields (not yet queued).', 'ok');
    });

    const tInp = el.querySelector('#ve-title'), dInp = el.querySelector('#ve-desc'), tagsInp = el.querySelector('#ve-tags');
    function updateCounts() {
      el.querySelector('#ve-tlen').textContent = tInp.value.length;
      el.querySelector('#ve-dlen').textContent = new Blob([dInp.value]).size;
      const tagsArr = tagsInp.value.split(',').map(s => s.trim()).filter(Boolean);
      const issues = validateYouTubeMetadata(tInp.value, dInp.value, tagsArr);
      el.querySelector('#ve-issues').textContent = issues.join(' ');
    }
    tInp.addEventListener('input', updateCounts);
    dInp.addEventListener('input', updateCounts);
    tagsInp.addEventListener('input', updateCounts);
    updateCounts();

    el.querySelector('#ve-stage').addEventListener('click', () => {
      const tagsArr = tagsInp.value.split(',').map(s => s.trim()).filter(Boolean);
      const issues = validateYouTubeMetadata(tInp.value, dInp.value, tagsArr);
      if (issues.length) { toast(issues[0], 'err'); return; }
      enqueueWrite({
        type: 'video.update',
        videoId: video.id,
        summary: `Update "${tInp.value.slice(0, 32)}"`,
        snippetPatch: {
          title: tInp.value.trim(),
          description: dInp.value,
          categoryId: el.querySelector('#ve-cat').value,
          tags: tagsArr,
          defaultLanguage: el.querySelector('#ve-lang').value.trim() || undefined
        },
        statusPatch: {
          privacyStatus: el.querySelector('#ve-vis').value,
          license: el.querySelector('#ve-lic').value,
          embeddable: el.querySelector('#ve-embed').checked,
          publicStatsViewable: el.querySelector('#ve-stats').checked,
          selfDeclaredMadeForKids: el.querySelector('#ve-kids').checked,
          publishAt: (el.querySelector('#ve-vis').value === 'private' && el.querySelector('#ve-pubat').value) ? new Date(el.querySelector('#ve-pubat').value).toISOString() : undefined
        }
      });
    });

    el.querySelector('#ve-pl-sel').addEventListener('change', (e) => {
      if (!e.target.value) return;
      enqueueWrite({ type: 'playlist.add', playlistId: e.target.value, videoId: video.id, summary: `Add ${video.id} to playlist` });
      e.target.value = '';
    });

    el.querySelector('#ve-delete').addEventListener('click', () => {
      if (!confirm(`Stage PERMANENT deletion of "${video.snippet?.title}" into the Write Buffer?`)) return;
      enqueueWrite({ type: 'video.delete', videoId: video.id, summary: `DELETE ${video.id}` });
    });

    el.querySelector('#ve-open-stats').addEventListener('click', () => openViewInPane(pane.id, 'analytics', { videoId: video.id, title: 'Stats: ' + video.id }, true));
    el.querySelector('#ve-open-comments').addEventListener('click', () => {
      State.runtime.commentFilter.mode = 'video';
      State.runtime.commentFilter.videoId = video.id;
      openViewInPane(pane.id, 'comments', { videoId: video.id, title: 'Comments: ' + video.id }, true);
    });
    el.querySelector('#ve-cap-list').addEventListener('click', async () => {
      const out = el.querySelector('#ve-cap-out');
      if (isDemoMode()) { out.textContent = 'Demo mode: no remote captions.'; return; }
      try {
        const res = await apiFetch(`${YT_DATA_BASE}/captions?part=snippet&videoId=${encodeURIComponent(video.id)}`, {}, 50);
        const items = res?.items || [];
        out.innerHTML = items.map(c => `<div class="flex wrap" style="justify-content:space-between;margin-top:4px;"><span><strong>${esc(c.snippet?.language)}</strong> (${esc(c.snippet?.name || c.snippet?.trackKind)})</span><button class="sm danger" data-del-cap="${esc(c.id)}">✕ Delete (50u)</button></div>`).join('') || 'No caption tracks found.';
        out.querySelectorAll('[data-del-cap]').forEach(b => b.addEventListener('click', async () => {
          await apiFetch(`${YT_DATA_BASE}/captions?id=${encodeURIComponent(b.dataset.delCap)}`, { method: 'DELETE' }, 50);
          toast('Deleted caption track.', 'ok'); el.querySelector('#ve-cap-list').click();
        }));
      } catch (e) { out.textContent = 'Error: ' + e.message; }
    });
    el.querySelector('#ve-cap-up').addEventListener('click', async () => {
      const file = el.querySelector('#ve-cap-file').files?.[0];
      if (!file) return toast('Select an .srt or .vtt file first.', 'warn');
      if (isDemoMode()) return toast('Demo mode: caption upload simulated!', 'ok');
      try {
        addQuota(400);
        const initRes = await fetch('https://www.googleapis.com/upload/youtube/v3/captions?uploadType=resumable&part=snippet', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + State.auth.accessToken, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Length': String(file.size), 'X-Upload-Content-Type': 'application/octet-stream' },
          body: JSON.stringify({ snippet: { videoId: video.id, language: el.querySelector('#ve-cap-lang').value.trim() || 'en', name: el.querySelector('#ve-cap-name').value.trim() || file.name, isDraft: false } })
        });
        if (!initRes.ok) throw new Error(await initRes.text());
        const loc = initRes.headers.get('Location');
        const upRes = await fetch(loc, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
        if (!upRes.ok) throw new Error(await upRes.text());
        toast('Uploaded caption track!', 'ok'); el.querySelector('#ve-cap-list').click();
      } catch (e) { toast(e.message, 'err', 6000); }
    });

    el.querySelector('#ve-frame-vid').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        if (file.type.startsWith('video/')) {
          toast('Extracting 3 keyframes locally via <canvas>...', 'info');
          const res = await extractVideoFramesFromFile(file);
          thState.frames = res.frames.map(f => f.dataUrl);
        } else {
          const reader = new FileReader();
          await new Promise(res => {
            reader.onload = () => { thState.frames.unshift(reader.result); thState.frames = thState.frames.slice(0, 3); res(); };
            reader.readAsDataURL(file);
          });
        }
        renderViewInto(el, pane, tab);

  function parseCsvRow(line) {
    const out = []; let cur = "", inQ = false, q = String.fromCharCode(34);
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === q) { if (inQ && line[i + 1] === q) { cur += q; i++; } else { inQ = !inQ; } }
      else if (ch === "," && !inQ) { out.push(cur.trim()); cur = ""; }
      else { cur += ch; }
    }
    out.push(cur.trim()); return out;
  }
  function mergeReachCsvIntoMap(csvText, isApiCsv, destMap) {
    const lines = csvText.split(String.fromCharCode(10)).map(l => l.replace(String.fromCharCode(13), "")).filter(Boolean);
    if (lines.length < 2) return 0;
    const hdr = parseCsvRow(lines[0]).map(h => h.toLowerCase());
    const iVid = hdr.findIndex(h => h === "video_id" || h === "content" || h === "video id");
    const iImp = hdr.findIndex(h => h === "video_thumbnail_impressions" || h === "impressions" || h === "thumbnail impressions");
    const iCtr = hdr.findIndex(h => h === "video_thumbnail_impressions_ctr" || h.includes("click-through rate"));
    if (iVid < 0 || iImp < 0) return 0;
    const iTitle = hdr.findIndex(h => h === "video title" || h === "title");
    const extraCols = [["stayedToWatchPct","stayed to watch (%)"],["uniqueViewers","unique viewers"],["uniqueReach","unique reach"],["coViewedViews","views (co-viewed)"],["avgViewsPerViewer","average views per viewer"],["newViewers","new viewers"],["returningViewers","returning viewers"],["casualViewers","casual viewers"],["regularViewers","regular viewers"]].map(([k, n]) => [k, hdr.indexOf(n)]).filter(x => x[1] >= 0);
    let added = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvRow(lines[i]);
      const vid = (cols[iVid] || "").trim(); if (!vid || vid.toLowerCase() === "total") continue;
      const imp = Number(String(cols[iImp] || 0).replace(/,/g, "")) || 0;
      const rawCtr = iCtr >= 0 ? (Number(String(cols[iCtr] || 0).replace(/%/g, "")) || 0) : 0;
      const ctrPct = isApiCsv ? rawCtr * 100 : rawCtr;
      if (!destMap[vid]) destMap[vid] = { imp: 0, wCtr: 0, extras: {} };
      destMap[vid].imp += imp; destMap[vid].wCtr += imp * ctrPct;
      if (iTitle >= 0 && cols[iTitle]) destMap[vid].extras.csvTitle = cols[iTitle];
      extraCols.forEach(([k, idx]) => { const val = Number(String(cols[idx] || "").replace(/[,%]/g, "")); if (cols[idx] !== "" && Number.isFinite(val)) destMap[vid].extras[k] = val; });
      added++;
    }
    return added;
  }
  async function syncReachReportImpressionsCtr(cache, r) {
    if (isDemoMode()) {
      const out = {};
      DEMO.videos.forEach((v, idx) => { const vw = Number(v.statistics?.viewCount || 10); out[v.id] = { videoThumbnailImpressions: vw * 19 + 120, videoThumbnailImpressionsClickRate: Number((4.6 + ((idx * 2.1) % 7.5)).toFixed(2)) }; });
      cache.reachByVideo = out; cache.ts = cache.ts || {}; cache.ts.reach = Date.now(); saveChannelCache(cache); return { status: "ok", count: Object.keys(out).length };
    }
    let jobsResp;
    try { jobsResp = await apiFetch(`${YT_REPORTING_URL}/jobs`, {}, 1); }
    catch (e) {
      if (String(e.message).includes("disabled") || e.status === 403) throw new Error("Enable YouTube Reporting API on project 1098302687714 (console.developers.google.com/apis/api/youtubereporting.googleapis.com/overview?project=1098302687714) or use Import Studio CSV.");
      throw e;
    }
    let job = (jobsResp?.jobs || []).find(j => j.reportTypeId === "channel_reach_basic_a1");
    if (!job) {
      job = await apiFetch(`${YT_REPORTING_URL}/jobs`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reportTypeId: "channel_reach_basic_a1", name: "Studio Deck Reach" }) }, 1);
      return { status: "created", message: "Created channel_reach_basic_a1 Reporting job! Google delivers the first CSV files in 24-48h. Use Import Studio CSV for instant CTR right now." };
    }
    const reps = await apiFetch(`${YT_REPORTING_URL}/jobs/${encodeURIComponent(job.id)}/reports`, {}, 1);
    const files = (reps?.reports || []).filter(f => !f.endTime || (f.endTime.slice(0, 10) >= r.start && f.startTime.slice(0, 10) <= r.end)).slice(-35);
    const agg = {};
    for (const f of files) {
      const res = await fetch(f.downloadUrl, { headers: { Authorization: "Bearer " + State.auth.accessToken } });
      if (res.ok) mergeReachCsvIntoMap(await res.text(), true, agg);
    }
    const out = {};
    Object.entries(agg).forEach(([vid, d]) => { out[vid] = { videoThumbnailImpressions: d.imp, videoThumbnailImpressionsClickRate: d.imp > 0 ? Number((d.wCtr / d.imp).toFixed(2)) : 0 }; });
    cache.reachByVideo = out; cache.ts = cache.ts || {}; cache.ts.reach = Date.now(); saveChannelCache(cache);
    return { status: files.length ? "ok" : "pending", count: Object.keys(out).length };
  }

      </div>

      <div id="an-body"><div class="card muted">Loading analytics report...</div></div>
    `;

    el.querySelector('#an-clear-vid')?.addEventListener('click', () => {
      tab.params.videoId = '';
      renderAnalyticsView(el, pane, tab);
    });
    el.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => {
      const days = Number(b.dataset.range);
      r.preset = days + 'd';
      r.start = pacificDateStr(-days);
      r.end = pacificDateStr(0);
      renderAnalyticsView(el, pane, tab);
    }));
    el.querySelector('#an-start').addEventListener('change', (e) => { r.start = e.target.value; r.preset = 'custom'; });
    el.querySelector('#an-end').addEventListener('change', (e) => { r.end = e.target.value; r.preset = 'custom'; });
    el.querySelector('#an-refresh').addEventListener('click', () => loadAnalyticsSection(el.querySelector('#an-body'), activeSec, focusVideoId, true));
    el.querySelectorAll('[data-ansec]').forEach(b => b.addEventListener('click', () => {
      State.runtime.analyticsTab = b.dataset.ansec;
      tab.params.section = b.dataset.ansec;
      renderAnalyticsView(el, pane, tab);
    }));

    loadAnalyticsSection(el.querySelector('#an-body'), activeSec, focusVideoId, false);
  }

  async function loadAnalyticsSection(container, section, videoId, force) {
    const r = State.runtime.analyticsRange;
    const filterStr = videoId ? `video==${videoId}` : undefined;
    const cache = getChannelCache();

    try {
      if (section === 'overview') {
        const rep = await queryAnalyticsReport({
          startDate: r.start, endDate: r.end,
          dimensions: 'day',
          filters: filterStr,
          metrics: ['views', 'estimatedMinutesWatched', 'averageViewDuration', 'averageViewPercentage', 'likes', 'dislikes', 'comments', 'shares', 'subscribersGained', 'subscribersLost'],
          fallbackMetrics: ['views', 'estimatedMinutesWatched', 'averageViewDuration', 'likes', 'comments', 'subscribersGained']
        }, force);
        const cols = (rep.columnHeaders || []).map(c => c.name);
        const rows = rep.rows || [];
        const idx = (n) => cols.indexOf(n);
        const sumCol = (n) => { const i = idx(n); return i < 0 ? 0 : rows.reduce((a, row) => a + Number(row[i] || 0), 0); };
        const avgCol = (n) => { const i = idx(n); return (i < 0 || !rows.length) ? 0 : sumCol(n) / rows.length; };

        container.innerHTML = `
          <div class="grid-auto" style="margin-bottom:10px;">
            <div class="card"><div class="small muted">Views</div><div class="mono" style="font-size:1.4em;font-weight:700;">${fmtNum(sumCol('views'))}</div></div>
            <div class="card"><div class="small muted">Watch Time (hrs)</div><div class="mono" style="font-size:1.4em;font-weight:700;">${(sumCol('estimatedMinutesWatched') / 60).toFixed(1)}</div></div>
            <div class="card"><div class="small muted">Avg View Duration</div><div class="mono" style="font-size:1.4em;font-weight:700;">${fmtSecs(avgCol('averageViewDuration'))}</div></div>
            <div class="card"><div class="small muted">Likes / Comments</div><div class="mono" style="font-size:1.4em;font-weight:700;">${fmtNum(sumCol('likes'))} / ${fmtNum(sumCol('comments'))}</div></div>
            <div class="card"><div class="small muted">Net Subs</div><div class="mono" style="font-size:1.4em;font-weight:700;">${fmtNum(sumCol('subscribersGained') - sumCol('subscribersLost'))}</div></div>
          </div>
          <div class="chart-box" id="an-daily-chart"></div>
        `;
        buildLineChartSvg(container.querySelector('#an-daily-chart'), {
          labels: rows.map(row => row[0]),
          series: [
            { name: 'Views', color: 'var(--accent)', values: rows.map(row => Number(row[idx('views')] || 0)), area: true },
            { name: 'Watch Time (min)', color: 'var(--success)', values: rows.map(row => Number(row[idx('estimatedMinutesWatched')] || 0)) }
          ]
        });
        return;
      }

      if (section === "top_x") {
        const tx = State.runtime.topX;
        if (tx.order === undefined) tx.order = "desc";
        const groups = Array.from(new Set(TOP_X_METRICS.map(m => m[2])));
        container.innerHTML = `
          <div class="card flex wrap" style="margin-bottom:10px;">
            <label class="small muted">Show:</label>
            <input type="number" id="tx-count" class="sm" min="1" max="200" value="${tx.count}" style="width:68px;">
            <select id="tx-order" class="sm">
              <option value="desc" ${tx.order === "desc" ? "selected" : ""}>Top (Highest)</option>
              <option value="asc" ${tx.order === "asc" ? "selected" : ""}>Bottom (Lowest)</option>
            </select>
            <select id="tx-metric" class="sm" style="max-width:300px;">
              ${groups.map(g => `<optgroup label="${esc(g)}">${TOP_X_METRICS.filter(m => m[2] === g).map(([k, lbl]) => `<option value="${k}" ${tx.metric === k ? "selected" : ""}>${esc(lbl)}</option>`).join("")}</optgroup>`).join("")}
            </select>
            <button class="sm primary" id="tx-run">Rank Videos</button>
            <button class="sm" id="tx-sync-reach" title="YouTube Reporting API v1 (channel_reach_basic_a1)">📡 Sync Reach (CTR/Impr)</button>
            <label class="btn sm" style="cursor:pointer;" title="Import YouTube Studio Export CSV for instant CTR & Impressions">📄 Import Studio CSV<input type="file" id="tx-csv" accept=".csv" style="display:none;"></label>
          </div>
          <div id="tx-result" class="card muted">Fetching all Analytics metric batches...</div>
        `;
        const runRank = async () => {
          const n = Math.max(1, Math.min(200, Number(container.querySelector("#tx-count").value || 10)));
          const metric = container.querySelector("#tx-metric").value;
          const order = container.querySelector("#tx-order").value;
          tx.count = n; tx.metric = metric; tx.order = order;
          const meta = TOP_X_METRICS.find(x => x[0] === metric) || [metric, metric, "Other", "num"];
          const fmtType = meta[3];
          const byVid = {};
          (cache.videos || []).forEach(v => { byVid[v.id] = { videoId: v.id, views: 0, likes: 0, dislikes: 0, comments: 0, shares: 0, estimatedMinutesWatched: 0, subscribersGained: 0, subscribersLost: 0 }; });
          const mergeRep = (rep) => {
            if (!rep || !rep.rows) return;
            const cols = (rep.columnHeaders || []).map(c => c.name);
            rep.rows.forEach(row => {
              const vid = row[0]; if (!vid) return;
              if (!byVid[vid]) byVid[vid] = { videoId: vid };
              cols.forEach((cName, ci) => { if (ci > 0) byVid[vid][cName] = Number(row[ci] || 0); });
            });
          };
          const batches = [
            ["views", "estimatedMinutesWatched", "averageViewDuration", "averageViewPercentage", "likes", "dislikes", "comments", "shares", "subscribersGained", "subscribersLost"],
            ["views", "engagedViews", "redViews", "estimatedRedMinutesWatched", "videosAddedToPlaylists", "videosRemovedFromPlaylists"],
            ["views", "cardImpressions", "cardClicks", "cardClickRate", "cardTeaserImpressions", "cardTeaserClicks", "cardTeaserClickRate"],
            ["views", "endScreenElementImpressions", "endScreenElementClicks", "endScreenElementClickRate", "annotationImpressions", "annotationClicks", "annotationClickThroughRate"]
          ];
          if (State.prefs.includeMonetaryScope) batches.push(["views", "estimatedRevenue", "estimatedAdRevenue", "grossRevenue", "estimatedRedPartnerRevenue", "monetizedPlaybacks", "playbackBasedCpm", "adImpressions", "cpm"]);
          const coreRep = await queryAnalyticsReport({ startDate: r.start, endDate: r.end, dimensions: "video", metrics: batches[0], fallbackMetrics: ["views", "estimatedMinutesWatched", "likes", "comments", "shares"], sort: "-views", maxResults: 200 }, force);
          mergeRep(coreRep);
          await Promise.all(batches.slice(1).map(mList => queryAnalyticsReport({ startDate: r.start, endDate: r.end, dimensions: "video", metrics: mList, sort: "-views", maxResults: 200 }, force).then(mergeRep).catch(() => {})));
          const nonDirect = new Set(["videoThumbnailImpressions", "videoThumbnailImpressionsClickRate", "stayedToWatchPct", "uniqueViewers", "uniqueReach", "coViewedViews", "avgViewsPerViewer", "newViewers", "returningViewers", "casualViewers", "regularViewers", "watchHours", "netLikes", "netSubscribers", "likeRate", "dislikeRate", "commentRate", "shareRate", "subConversionRate", "engagementRate"]);
          if (!nonDirect.has(metric)) {
            await queryAnalyticsReport({ startDate: r.start, endDate: r.end, dimensions: "video", metrics: Array.from(new Set([metric, "views"])), sort: (order === "asc" ? "" : "-") + metric, maxResults: n }, force).then(mergeRep).catch(() => {});
          }
          if (cache.reachByVideo) { Object.entries(cache.reachByVideo).forEach(([vid, rd]) => { if (!byVid[vid]) byVid[vid] = { videoId: vid }; Object.assign(byVid[vid], rd); }); }
          const allRows = Object.values(byVid).map(m => {
            const vw = Number(m.views || 0);
            m.watchHours = Number(m.estimatedMinutesWatched || 0) / 60;
            m.netLikes = Number(m.likes || 0) - Number(m.dislikes || 0);
            m.netSubscribers = Number(m.subscribersGained || 0) - Number(m.subscribersLost || 0);
            m.likeRate = vw > 0 ? (Number(m.likes || 0) / vw) * 100 : 0;
            m.dislikeRate = vw > 0 ? (Number(m.dislikes || 0) / vw) * 100 : 0;
            m.commentRate = vw > 0 ? (Number(m.comments || 0) / vw) * 100 : 0;
            m.shareRate = vw > 0 ? (Number(m.shares || 0) / vw) * 100 : 0;
            m.subConversionRate = vw > 0 ? (Number(m.subscribersGained || 0) / vw) * 100 : 0;
            m.engagementRate = vw > 0 ? ((Number(m.likes || 0) + Number(m.comments || 0) + Number(m.shares || 0)) / vw) * 100 : 0;
            return { ...m, val: Number(m[metric] ?? 0) };
          });
          allRows.sort((a, b) => order === "asc" ? (a.val - b.val) : (b.val - a.val));
          const rowsOut = allRows.slice(0, n);
          const maxVal = Math.max(1e-6, ...rowsOut.map(x => Math.abs(x.val)));
          const fmtMetricVal = (v) => {
            if (fmtType === "sec") return fmtSecs(v);
            if (fmtType === "pct") return Number(v).toFixed(2) + "%";
            if (fmtType === "pct100") return (Math.abs(v) <= 1 && v !== 0 ? v * 100 : v).toFixed(2) + "%";
            if (fmtType === "dec") return Number(v).toFixed(2);
            if (fmtType === "usd") return "$" + Number(v).toFixed(2);
            return fmtNum(v);
          };
          const reachBanner = meta[2] === "Reach" && !cache.reachByVideo ? "<div class=badge style=margin-bottom:8px;border-color:var(--warning);color:var(--warning)>Click Sync Reach (CTR/Impr) or Import Studio CSV to load Thumbnail Impressions & CTR.</div>" : "";
          container.querySelector("#tx-result").innerHTML = reachBanner + `
            <div class="studio-table-wrap">
              <table class="studio-table">
                <thead><tr><th>#</th><th>Video</th><th>Bar</th><th class="num-col">${esc(meta[1])}</th><th class="num-col">Views</th><th class="num-col">Watch (m)</th><th class="num-col">Avg %</th><th class="num-col">CTR %</th></tr></thead>
                <tbody>
                  ${rowsOut.map((item, i) => {
                    const vid = cache.videos.find(v => v.id === item.videoId);
                    const pct = Math.max(2, Math.round((Math.abs(item.val) / maxVal) * 100));
                    return `
                      <tr>
                        <td class="mono"><strong>#${i + 1}</strong></td>
                        <td><div class="flex">${vid?.snippet?.thumbnails?.medium?.url ? `<img src="${esc(vid.snippet.thumbnails.medium.url)}" style="width:64px;height:36px;object-fit:cover;border-radius:3px;">` : ""}<div><div style="font-weight:600;">${esc(vid?.snippet?.title || item.csvTitle || item.videoId)}</div><div class="small muted mono">${esc(item.videoId)}</div></div></div></td>
                        <td style="width:140px;"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></td>
                        <td class="num-col mono"><strong>${esc(fmtMetricVal(item.val))}</strong></td>
                        <td class="num-col mono muted">${fmtNum(item.views || 0)}</td>
                        <td class="num-col mono muted">${fmtNum(item.estimatedMinutesWatched || 0)}</td>
                        <td class="num-col mono muted">${item.averageViewPercentage !== undefined ? Number(item.averageViewPercentage).toFixed(1) + "%" : "—"}</td>
                        <td class="num-col mono muted">${item.videoThumbnailImpressionsClickRate !== undefined ? Number(item.videoThumbnailImpressionsClickRate).toFixed(2) + "%" : "—"}</td>
                      </tr>`;
                  }).join("") || "<tr><td colspan=8 class=muted>No analytics rows returned for this date range.</td></tr>"}
                </tbody>
              </table>
            </div>`;
        };
        container.querySelector("#tx-sync-reach").addEventListener("click", async () => {
          try {
            const res = await syncReachReportImpressionsCtr(cache, r);
            if (res.status === "created") toast(res.message, "warn", 7000);
            else if (res.status === "pending") toast("Reporting job active, waiting on YouTube first daily CSV (or Import Studio CSV).", "warn", 5000);
            else toast("Synced Reach Impressions & CTR for " + res.count + " videos!", "ok");
            await runRank();
          } catch (e) { toast(e.message, "err", 7000); }
        });
        container.querySelector("#tx-csv").addEventListener("change", async (e) => {
          const f = e.target.files?.[0]; if (!f) return;
          if (f.name.toLowerCase().includes("totals")) toast("Totals.csv only has publish dates — pick Table data.csv for Impressions & CTR!", "warn", 5000);
          const agg = {}; const n = mergeReachCsvIntoMap(await f.text(), false, agg);
          if (!n) return toast("Could not find Content + Thumbnail impressions columns. Pick Table data.csv from Studio export!", "err", 6000);
          const out = {}; Object.entries(agg).forEach(([vid, d]) => { out[vid] = { ...(d.extras || {}), videoThumbnailImpressions: d.imp, videoThumbnailImpressionsClickRate: d.imp > 0 ? Number((d.wCtr / d.imp).toFixed(2)) : 0 }; });
          cache.reachByVideo = out; saveChannelCache(cache); toast("Imported Thumbnail Impressions & CTR for " + Object.keys(out).length + " videos!", "ok");
          await runRank();
        });
        container.querySelector("#tx-run").addEventListener("click", runRank);
        container.querySelector("#tx-metric").addEventListener("change", runRank);
        container.querySelector("#tx-order").addEventListener("change", runRank);
        await runRank();
        return;
      }

      if (section === 'live') {
        renderLiveGranularSection(container, videoId || 'CHANNEL');
        return;
      }

      if (section === 'retention') {
        const targetVid = videoId || cache.videos[0]?.id;
        if (!targetVid) { container.innerHTML = '<div class="card muted">No video found for retention curve.</div>'; return; }
        const rep = await queryAnalyticsReport({
          startDate: r.start, endDate: r.end,
          dimensions: 'elapsedVideoTimeRatio',
          filters: `video==${targetVid}`,
          metrics: ['audienceWatchRatio', 'relativeRetentionPerformance']
        }, force);
        const rows = rep.rows || [];
        container.innerHTML = `
          <div class="card" style="margin-bottom:10px;">
            <div class="flex wrap" style="justify-content:space-between;">
              <strong>Audience Retention Curve — ${esc(cache.videos.find(v => v.id === targetVid)?.snippet?.title || targetVid)}</strong>
              <select id="ret-vid" class="sm">
                ${cache.videos.map(v => `<option value="${esc(v.id)}" ${v.id === targetVid ? 'selected' : ''}>${esc(v.snippet?.title?.slice(0, 48))}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="chart-box" id="ret-chart"></div>
        `;
        container.querySelector('#ret-vid').addEventListener('change', (e) => loadAnalyticsSection(container, 'retention', e.target.value, false));
        buildLineChartSvg(container.querySelector('#ret-chart'), {
          labels: rows.map(row => Math.round(Number(row[0]) * 100) + '%'),
          formatVal: v => (v * 100).toFixed(1) + '%',
          series: [
            { name: 'Audience Watch Ratio', color: 'var(--accent)', values: rows.map(row => Number(row[1])), area: true },
            { name: 'Relative Retention', color: 'var(--warning)', values: rows.map(row => Number(row[2])), dashed: true }
          ]
        });
        return;
      }

      // Dimension breakdown helper for traffic, geo, devices, audience, formats
      const dimSpecs = {
        traffic: { title: 'Traffic Sources', dimensions: 'insightTrafficSourceType', metrics: ['views', 'estimatedMinutesWatched'], sort: '-views' },
        geo: { title: 'Countries / Territories', dimensions: 'country', metrics: ['views', 'estimatedMinutesWatched'], sort: '-views', maxResults: 30 },
        devices: { title: 'Device Type & Operating System', multi: [
          { title: 'Device Type', dimensions: 'deviceType', metrics: ['views', 'estimatedMinutesWatched'], sort: '-views' },
          { title: 'Operating System', dimensions: 'operatingSystem', metrics: ['views', 'estimatedMinutesWatched'], sort: '-views' }
        ]},
        audience: { title: 'Audience Demographics & Subscription Status', multi: [
          { title: 'Age & Gender (%)', dimensions: 'ageGroup,gender', metrics: ['viewerPercentage'], sort: '-viewerPercentage' },
          { title: 'Subscribed vs Unsubscribed', dimensions: 'subscribedStatus', metrics: ['views', 'estimatedMinutesWatched'] }
        ]},
        formats: { title: 'Creator Content Type (VOD vs Shorts vs Live)', dimensions: 'day,creatorContentType', metrics: ['views', 'estimatedMinutesWatched'] }
      };

      const spec = dimSpecs[section];
      const queries = spec.multi || [spec];
      const results = await Promise.all(queries.map(q => queryAnalyticsReport({
        startDate: r.start, endDate: r.end, dimensions: q.dimensions,
        filters: filterStr, metrics: q.metrics, sort: q.sort, maxResults: q.maxResults
      }, force)));

      container.innerHTML = results.map((rep, idx) => {
        const q = queries[idx];
        const cols = (rep.columnHeaders || []).map(c => c.name);
        const rows = rep.rows || [];
        return `
          <div class="card" style="margin-bottom:10px;">
            <strong>${esc(q.title || spec.title)}</strong>
            <div class="studio-table-wrap" style="margin-top:8px;">
              <table class="studio-table">
                <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                <tbody>
                  ${rows.map(row => `<tr>${row.map(cell => `<td class="mono">${esc(cell)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">No rows for this date range.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="card" style="border-color:var(--danger);"><strong>Analytics Error:</strong> ${esc(err.message)}</div>`;
    }
  }

  /* ---------- VERY GRANULAR LIVE SNAPSHOT ENGINE (WITH REMOVED SAMPLES) ---------- */
  function renderLiveGranularSection(container, targetId) {
    const cache = getChannelCache();
    const allSamples = getLiveSeries();
    const tgt = State.runtime.liveTargetVideoId || targetId || 'CHANNEL';
    const samples = allSamples.filter(s => s.target === tgt);
    const active = samples.filter(s => s.status === 'active');
    const removedCount = samples.filter(s => s.status !== 'active').length;

    let visible = State.runtime.liveShowRemoved ? samples : active;
    if (State.runtime.liveZoom > 0 && visible.length > State.runtime.liveZoom) {
      visible = visible.slice(-State.runtime.liveZoom);
    }

    const latest = active[active.length - 1];
    const prev = active[active.length - 2];
    const deltaViews = (latest && prev) ? (latest.views - prev.views) : 0;
    const deltaMin = (latest && prev) ? Math.max(0.1, (latest.ts - prev.ts) / 60000) : 1;
    const velocity = (deltaViews / deltaMin).toFixed(2);

    container.innerHTML = `
      <div class="card flex wrap" style="justify-content:space-between;margin-bottom:10px;">
        <div class="flex wrap">
          <strong>⚡ Very Granular Live Tracker</strong>
          <select id="lv-target" class="sm">
            <option value="CHANNEL" ${tgt === 'CHANNEL' ? 'selected' : ''}>Entire Channel</option>
            ${(cache.videos || []).map(v => `<option value="${esc(v.id)}" ${tgt === v.id ? 'selected' : ''}>${esc(v.snippet?.title?.slice(0, 40))}</option>`).join('')}
          </select>
          <button class="sm primary" id="lv-refresh-now">↻ Refresh Live Now (1 unit)</button>
          <select id="lv-auto" class="sm">
            <option value="0" ${State.runtime.liveAutoSeconds === 0 ? 'selected' : ''}>Auto-poll: Off</option>
            <option value="30" ${State.runtime.liveAutoSeconds === 30 ? 'selected' : ''}>Every 30s</option>
            <option value="60" ${State.runtime.liveAutoSeconds === 60 ? 'selected' : ''}>Every 60s</option>
            <option value="300" ${State.runtime.liveAutoSeconds === 300 ? 'selected' : ''}>Every 5m</option>
          </select>
        </div>
        <div class="flex wrap">
          <label class="flex small"><input type="checkbox" id="lv-show-rem" ${State.runtime.liveShowRemoved ? 'checked' : ''}> Show Removed / Audit-Drop Samples (${removedCount})</label>
          <select id="lv-zoom" class="sm">
            <option value="0" ${State.runtime.liveZoom === 0 ? 'selected' : ''}>Zoom: All (${samples.length})</option>
            <option value="20" ${State.runtime.liveZoom === 20 ? 'selected' : ''}>Last 20 pts</option>
            <option value="50" ${State.runtime.liveZoom === 50 ? 'selected' : ''}>Last 50 pts</option>
          </select>
          <button class="sm" id="lv-export">⬇ Export JSON</button>
        </div>
      </div>

      <div class="grid-auto" style="margin-bottom:10px;">
        <div class="card"><div class="small muted">Latest Active Views</div><div class="mono" style="font-size:1.35em;font-weight:700;">${latest ? fmtNum(latest.views) : '—'}</div></div>
        <div class="card"><div class="small muted">Δ Last Sample</div><div class="mono" style="font-size:1.35em;font-weight:700;">${deltaViews >= 0 ? '+' : ''}${deltaViews} views (${velocity}/min)</div></div>
        <div class="card"><div class="small muted">Stored Samples</div><div class="mono" style="font-size:1.35em;font-weight:700;">${samples.length} <span class="small muted">(${removedCount} removed/audit)</span></div></div>
      </div>

      <div class="chart-box" id="lv-chart" style="margin-bottom:10px;"></div>

      <div class="card">
        <strong>Sample Audit Log (Archive preserves every sample — toggle Prune / Restore)</strong>
        <div class="studio-table-wrap" style="margin-top:8px;max-height:280px;">
          <table class="studio-table">
            <thead><tr><th>Timestamp</th><th>Status</th><th class="num-col">Views</th><th class="num-col">Δ Prev</th><th class="num-col">Likes</th><th class="num-col">Subs</th><th>Reason / Action</th></tr></thead>
            <tbody>
              ${visible.slice().reverse().map((s) => {
                const isRem = s.status !== 'active';
                const idxInAll = visible.indexOf(s);
                const prevS = idxInAll > 0 ? visible[idxInAll - 1] : null;
                const d = prevS ? (s.views - prevS.views) : 0;
                return `
                  <tr style="${isRem ? 'opacity:.72;' : ''}">
                    <td class="mono small">${new Date(s.ts).toLocaleString()}</td>
                    <td><span class="badge ${s.status === 'active' ? 'ok' : s.status === 'audit_drop' ? 'warn' : 'bad'}">${esc(s.status)}</span></td>
                    <td class="num-col mono">${fmtNum(s.views)}</td>
                    <td class="num-col mono" style="color:${d < 0 ? 'var(--danger)' : d > 0 ? 'var(--success)' : 'var(--text-muted)'};">${d >= 0 ? '+' : ''}${d}</td>
                    <td class="num-col mono">${fmtNum(s.likes)}</td>
                    <td class="num-col mono">${fmtNum(s.subs)}</td>
                    <td class="small">
                      ${esc(s.reason || '')}
                      <button class="sm" data-toggle-sample="${esc(s.id)}">${s.status === 'removed' ? '↺ Restore' : '✕ Mark Removed'}</button>
                    </td>
                  </tr>`;
              }).join('') || '<tr><td colspan="7" class="muted">Click "Refresh Live Now" to record your first granular snapshot.</td></tr>'}
            </tbody>
          </table>

        if (s.status === 'removed') { s.status = 'active'; s.reason = ''; }
        else { s.status = 'removed'; s.reason = 'Manually pruned (preserved in archive)'; }
        saveLiveSeries(list);
      }
      renderLiveGranularSection(container, tgt);
    }));
  }

  async function takeLiveSample(target) {
    const list = getLiveSeries();
    const prevActive = list.filter(s => s.target === target && s.status === 'active').slice(-1)[0];
    let views = 0, likes = 0, comments = 0, subs = 0;

    if (isDemoMode()) {
      const cache = getChannelCache();
      const base = prevActive ? prevActive.views : (target === 'CHANNEL' ? Number(cache.channel.statistics.viewCount) : Number(cache.videos.find(v => v.id === target)?.statistics?.viewCount || 15));
      const bump = Math.random() < 0.14 ? -2 : Math.floor(Math.random() * 6) + 1;
      views = Math.max(0, base + bump);
      likes = (prevActive?.likes || 40) + (bump > 3 ? 1 : 0);
      comments = prevActive?.comments || 3;
      subs = Number(cache.channel.statistics.subscriberCount || 44);
    } else {
      if (target === 'CHANNEL') {
        const res = await apiFetch(`${YT_DATA_BASE}/channels?part=statistics&mine=true`, {}, 1);
        const st = res?.items?.[0]?.statistics || {};
        views = Number(st.viewCount || 0);
        subs = Number(st.subscriberCount || 0);
        likes = 0;
        comments = Number(st.videoCount || 0);
      } else {
        const res = await apiFetch(`${YT_DATA_BASE}/videos?part=statistics&id=${encodeURIComponent(target)}`, {}, 1);
        const st = res?.items?.[0]?.statistics || {};
        views = Number(st.viewCount || 0);
        likes = Number(st.likeCount || 0);
        comments = Number(st.commentCount || 0);
      }
    }

    const isAuditDrop = prevActive && views < prevActive.views;
    list.push({
      id: 'smp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
      ts: Date.now(),
      target,
      views, likes, comments, subs,
      status: isAuditDrop ? 'audit_drop' : 'active',
      reason: isAuditDrop ? `YouTube live count decreased by ${prevActive.views - views}` : ''
    });
    // Keep up to 1500 samples per channel safely
    if (list.length > 1500) list.splice(0, list.length - 1500);
    saveLiveSeries(list);
    toast(`Recorded live snapshot: ${fmtNum(views)} views${isAuditDrop ? ' (audit drop flagged!)' : ''}`, isAuditDrop ? 'warn' : 'ok');
  }

  function renderWorkspace() {
    const ws = document.getElementById('workspace');
    ws.setAttribute('data-splits', State.workspace.layout);
    ws.innerHTML = '';

    State.workspace.panes.forEach((pane, idx) => {
      const activeTab = getActiveTab(pane);
      const isFocused = pane.id === State.workspace.focusedPaneId;

      const paneEl = document.createElement('section');
      paneEl.className = `pane ${isFocused ? 'focused' : ''}`;
      paneEl.dataset.paneId = pane.id;

      paneEl.innerHTML = `
        <div class="pane-header">
          <span class="pane-num">#${idx + 1}</span>
          <div class="pane-tabs">
            ${pane.tabs.map(t => `
              <div class="pane-tab ${t.id === activeTab.id ? 'active' : ''}" data-tid="${esc(t.id)}">
                <span class="truncate">${VIEW_META[t.view]?.icon || ''} ${esc(t.title)}</span>
                ${pane.tabs.length > 1 ? `<span class="tab-close" data-close-tid="${esc(t.id)}" title="Close tab">✕</span>` : ''}
              </div>
            `).join('')}
          </div>
          <select class="sm pane-override" title="Override this pane's active view" style="max-width:130px;">
            ${Object.entries(VIEW_META).map(([k, m]) => `<option value="${k}" ${activeTab.view === k ? 'selected' : ''}>${m.icon} ${m.label}</option>`).join('')}
          </select>
          <button class="sm pane-newtab" title="New tab in this pane">+</button>
          ${State.workspace.panes.length > 1 ? `<button class="sm pane-close" title="Close split pane (p then w)">✕</button>` : ''}
        </div>
        <div class="pane-body"></div>
      `;

      paneEl.addEventListener('mousedown', () => {
        if (State.workspace.focusedPaneId !== pane.id) {
          State.workspace.focusedPaneId = pane.id;
          document.querySelectorAll('.pane').forEach(p => p.classList.toggle('focused', p.dataset.paneId === pane.id));
          updateNavActiveHighlight();
        }
      });

      paneEl.querySelectorAll('.pane-tab').forEach(tabEl => tabEl.addEventListener('click', (e) => {
        if (e.target.dataset.closeTid) {
          e.stopPropagation();
          pane.tabs = pane.tabs.filter(x => x.id !== e.target.dataset.closeTid);
          if (pane.activeTabId === e.target.dataset.closeTid) pane.activeTabId = pane.tabs[0].id;
          saveWorkspace(); renderWorkspace();
          return;
        }
        pane.activeTabId = tabEl.dataset.tid;
        State.workspace.focusedPaneId = pane.id;
        saveWorkspace(); renderWorkspace();
      }));

      paneEl.querySelector('.pane-override').addEventListener('change', (e) => {
        openViewInPane(pane.id, e.target.value, {}, false);
      });
      paneEl.querySelector('.pane-newtab').addEventListener('click', () => {
        openViewInPane(pane.id, 'analytics', {}, true);
      });
      paneEl.querySelector('.pane-close')?.addEventListener('click', () => closePane(pane.id));

      ws.appendChild(paneEl);
      renderViewInto(paneEl.querySelector('.pane-body'), pane, activeTab);
    });

    document.querySelectorAll('[data-layout]').forEach(b => b.classList.toggle('active', b.dataset.layout === String(State.workspace.panes.length)));
    updateNavActiveHighlight();
    updateQueueChrome();
  }

  function updateNavActiveHighlight() {
    const pane = getPane(State.workspace.focusedPaneId);
    const tab = getActiveTab(pane);
    const pIdx = State.workspace.panes.findIndex(p => p.id === pane.id) + 1;
    document.getElementById('focus-indicator').textContent = `Focused Pane: #${pIdx} (${VIEW_META[tab.view]?.label || tab.view})`;
    document.querySelectorAll('#nav-ribbon .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === tab.view));
  }

    State.accounts.activeId = accId;

    State.auth.accessToken = null; State.auth.expiresAt = 0;
    const saved = safeJsonParse(sessionStorage.getItem('ytdeck_tok_' + accId), null);
    if (saved && saved.accessToken && saved.expiresAt > Date.now() + 15000) {
      State.auth.accessToken = saved.accessToken;

      State.auth.grantedScope = saved.grantedScope || '';

  function openCommandPalette() {
    const cache = getChannelCache();
    const actions = [
      ...Object.entries(VIEW_META).map(([k, m]) => ({ label: `Go to ${m.icon} ${m.label}`, hint: 'Focused Pane', run: () => openViewInFocusedPane(k) })),
      ...Object.entries(VIEW_META).map(([k, m]) => ({ label: `Split → ${m.icon} ${m.label}`, hint: 'New Split', run: () => addSplitPane(k) })),
      { label: 'Theme Preset: Touch (GNOME)', hint: 't 1', run: () => { State.prefs.preset = 'touch'; savePrefs(); } },
      { label: 'Theme Preset: Modern (KDE)', hint: 't 2', run: () => { State.prefs.preset = 'modern'; savePrefs(); } },
      { label: 'Theme Preset: Compact (Windows 95)', hint: 't 3', run: () => { State.prefs.preset = 'compact'; savePrefs(); } },
      { label: 'Toggle Dark / Light Theme', hint: 't d', run: () => { State.prefs.theme = State.prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); } },
      { label: 'Flush Write Buffer Queue Now', hint: 'Ctrl+Shift+S', run: () => flushWriteQueue() },
      { label: 'Sync Channel & Videos Now', hint: 'API', run: () => syncChannelAndVideos(true).then(renderWorkspace) },
      ...(cache.videos || []).map(v => ({
        label: `Edit Video: ${v.snippet?.title}`,
        hint: v.id,
        run: () => openViewInFocusedPane('video_editor', { videoId: v.id, title: 'Edit: ' + v.snippet?.title?.slice(0, 16) }, true)
      }))
    ];

    openModal('⌘ Command Palette', `
      <input id="cmd-input" style="width:100%;" placeholder="Type a view, video title, preset, split, or action...">
      <div class="cmd-list" id="cmd-list"></div>
    `);
    const inp = document.getElementById('cmd-input');
    const listEl = document.getElementById('cmd-list');
    let selIdx = 0;

    function renderList() {
      const q = inp.value.toLowerCase().trim();
      const filtered = actions.filter(a => a.label.toLowerCase().includes(q) || a.hint.toLowerCase().includes(q)).slice(0, 30);
      selIdx = Math.min(selIdx, Math.max(0, filtered.length - 1));
      listEl.innerHTML = filtered.map((a, i) => `
        <div class="cmd-item ${i === selIdx ? 'selected' : ''}" data-cidx="${i}">
          <span>${esc(a.label)}</span>
          <span class="small muted mono">${esc(a.hint)}</span>
        </div>`).join('');
      listEl.querySelectorAll('.cmd-item').forEach((item, i) => item.addEventListener('click', () => {
        closeModal(); filtered[i].run();
      }));
      return filtered;
    }

    let currentFiltered = renderList();
    inp.focus();
    inp.addEventListener('input', () => { selIdx = 0; currentFiltered = renderList(); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); selIdx = Math.min(currentFiltered.length - 1, selIdx + 1); currentFiltered = renderList(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); selIdx = Math.max(0, selIdx - 1); currentFiltered = renderList(); }
      else if (e.key === 'Enter' && currentFiltered[selIdx]) { e.preventDefault(); closeModal(); currentFiltered[selIdx].run(); }
    });
  }

  document.querySelectorAll('[data-preset-btn]').forEach(b => b.addEventListener('click', () => {

  }));

  });

  document.getElementById('btn-flush-now').addEventListener('click', () => flushWriteQueue());
  document.getElementById('btn-cmd').addEventListener('click', openCommandPalette);
  document.getElementById('btn-help').addEventListener('click', openSetupAndShortcutsModal);

  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeModal(); });
  document.getElementById('account-select').addEventListener('change', (e) => switchAccount(e.target.value));
  document.getElementById('btn-auth').addEventListener('click', () => triggerOAuthSignIn('consent'));

  document.querySelectorAll('#nav-ribbon .nav-btn').forEach(b => b.addEventListener('click', (e) => {
    openViewInFocusedPane(b.dataset.view, {}, e.shiftKey);
  }));

  document.addEventListener('keydown', (e) => {
    const inInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
    if (e.key === 'Escape') {
      closeModal();
      if (inInput) document.activeElement.blur();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); openCommandPalette(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') {
      e.preventDefault(); flushWriteQueue(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      const stageBtn = document.querySelector('.pane.focused #ve-stage');
      if (stageBtn) { e.preventDefault(); stageBtn.click(); }
      return;
    }
    if (e.altKey && e.key === '\\') { e.preventDefault(); addSplitPane('analytics'); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (inInput) return;
    if (e.key === '/') { e.preventDefault(); openCommandPalette(); return; }
    if (e.key === '?') { e.preventDefault(); openSetupAndShortcutsModal(); return; }
    const k = e.key.toLowerCase();
    if (State.runtime.keyPrefix) {
      const pfx = State.runtime.keyPrefix;
      clearTimeout(State.runtime.keyPrefixTimer); State.runtime.keyPrefix = null;
      if (pfx === 'g') {
        const target = { o: 'overview', v: 'videos', u: 'upload', a: 'analytics', c: 'comments', q: 'write_queue', s: 'accounts_settings' }[k];
        if (target) { e.preventDefault(); openViewInFocusedPane(target); }
      } else if (pfx === 't') {
        const preset = { '1': 'touch', '2': 'modern', '3': 'compact' }[k];
        if (preset) { e.preventDefault(); State.prefs.preset = preset; savePrefs(); }
        else if (k === 'd') { e.preventDefault(); State.prefs.theme = State.prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); }
      } else if (pfx === 'p') {
        if (k === 's') { e.preventDefault(); addSplitPane('analytics'); }
        else if (k === 'w') { e.preventDefault(); closePane(State.workspace.focusedPaneId); }
        else if (k === '[' || k === ']') {
          e.preventDefault(); const pane = getPane(State.workspace.focusedPaneId);
          const cur = pane.tabs.findIndex(t => t.id === pane.activeTabId);
          pane.activeTabId = pane.tabs[(cur + (k === ']' ? 1 : -1) + pane.tabs.length) % pane.tabs.length].id; saveWorkspace(); renderWorkspace();
        } else if (['1','2','3','4','5'].includes(k)) {
          const p = State.workspace.panes[Number(k) - 1];
          if (p) { e.preventDefault(); State.workspace.focusedPaneId = p.id; saveWorkspace(); renderWorkspace(); }
        }
      }
      return;
    }
    if (k === 'g' || k === 't' || k === 'p') {
      State.runtime.keyPrefix = k;
      State.runtime.keyPrefixTimer = setTimeout(() => { State.runtime.keyPrefix = null; }, 900);
    }
  });

  // Periodic token TTL countdown refresh
  setInterval(updateAuthChrome, 30000);

  // Boot!
  savePrefs();
  restoreOrConsumeOAuthToken();
  renderAccountSelect();
  updateAuthChrome();
  renderWorkspace();
  addQuota(0);
})();
</script>
</body>
</html>
