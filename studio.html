<!DOCTYPE html>
<html lang="en" data-preset="modern" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Studio Deck — Vanilla YouTube Studio</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ==========================================================================
   DESIGN TOKENS: 3 PRESETS (touch=GNOME, modern=KDE, compact=Win95) x 2 THEMES
   ========================================================================== */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  --danger: #e01b24;
  --warning: #e5a50a;
  --success: #2ec27e;
  --info: #3584e4;
}

/* ---------- PRESET 1: TOUCH (GNOME / Adwaita) ---------- */
html[data-preset="touch"] {
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-pill: 999px;
  --ctrl-h: 40px;
  --ctrl-h-sm: 34px;
  --pad-xs: 6px;
  --pad-sm: 10px;
  --pad-md: 16px;
  --pad-lg: 20px;
  --gap: 10px;
  --font-size: 14px;
  --font-size-sm: 12.5px;
  --row-py: 12px;
  --shadow: 0 2px 10px rgba(0,0,0,.18);
  --bevel-raised: none;
  --bevel-sunken: none;
}
html[data-preset="touch"][data-theme="light"] {
  --bg: #f6f5f4;
  --surface: #ffffff;
  --surface-2: #ebebeb;
  --surface-hover: #e4e4e4;
  --header-bg: #ebebeb;
  --border: #d0cfcd;
  --border-strong: #b6b4b1;
  --text: #2e3436;
  --text-muted: #5e5c64;
  --accent: #3584e4;
  --accent-hover: #1c71d8;
  --accent-fg: #ffffff;
  --accent-soft: rgba(53,132,228,.14);
  --pane-active-ring: rgba(53,132,228,.45);
}
html[data-preset="touch"][data-theme="dark"] {
  --bg: #1e1e1e;
  --surface: #2a2a2a;
  --surface-2: #343434;
  --surface-hover: #3e3e3e;
  --header-bg: #242424;
  --border: #3d3d3d;
  --border-strong: #555555;
  --text: #ffffff;
  --text-muted: #b0b0b0;
  --accent: #3584e4;
  --accent-hover: #62a0ea;
  --accent-fg: #ffffff;
  --accent-soft: rgba(53,132,228,.22);
  --pane-active-ring: rgba(98,160,234,.55);
}

/* ---------- PRESET 2: MODERN (KDE / Breeze) ---------- */
html[data-preset="modern"] {
  --radius-sm: 4px;
  --radius-md: 5px;
  --radius-lg: 6px;
  --radius-pill: 4px;
  --ctrl-h: 30px;
  --ctrl-h-sm: 26px;
  --pad-xs: 4px;
  --pad-sm: 8px;
  --pad-md: 12px;
  --pad-lg: 16px;
  --gap: 6px;
  --font-size: 13px;
  --font-size-sm: 11.5px;
  --row-py: 8px;
  --shadow: 0 1px 4px rgba(0,0,0,.15);
  --bevel-raised: none;
  --bevel-sunken: none;
}
html[data-preset="modern"][data-theme="light"] {
  --bg: #eff0f1;
  --surface: #fcfcfc;
  --surface-2: #e3e5e7;
  --surface-hover: #daedf9;
  --header-bg: #dee0e2;
  --border: #bdc3c7;
  --border-strong: #8d949b;
  --text: #232629;
  --text-muted: #5c636a;
  --accent: #3daee9;
  --accent-hover: #2980b9;
  --accent-fg: #ffffff;
  --accent-soft: rgba(61,174,233,.16);
  --pane-active-ring: #3daee9;
}
html[data-preset="modern"][data-theme="dark"] {
  --bg: #1b1e20;
  --surface: #232629;
  --surface-2: #2c3034;
  --surface-hover: #2d3e49;
  --header-bg: #1e2124;
  --border: #3d4247;
  --border-strong: #555b62;
  --text: #eff0f1;
  --text-muted: #9aa2a9;
  --accent: #3daee9;
  --accent-hover: #5ac0f4;
  --accent-fg: #0b1116;
  --accent-soft: rgba(61,174,233,.20);
  --pane-active-ring: #3daee9;
}

/* ---------- PRESET 3: COMPACT (Windows 95 Classic) ---------- */
html[data-preset="compact"] {
  --font-sans: "Tahoma", "MS Sans Serif", "Segoe UI", sans-serif;
  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;
  --radius-pill: 0px;
  --ctrl-h: 23px;
  --ctrl-h-sm: 20px;
  --pad-xs: 2px;
  --pad-sm: 5px;
  --pad-md: 7px;
  --pad-lg: 10px;
  --gap: 3px;
  --font-size: 11.5px;
  --font-size-sm: 10.5px;
  --row-py: 4px;
  --shadow: none;
}
html[data-preset="compact"][data-theme="light"] {
  --bg: #c0c0c0;
  --surface: #dfdfdf;
  --surface-2: #c0c0c0;
  --surface-well: #ffffff;
  --surface-hover: #000080;
  --header-bg: #c0c0c0;
  --border: #808080;
  --border-strong: #000000;
  --text: #000000;
  --text-muted: #333333;
  --accent: #000080;
  --accent-hover: #1084d0;
  --accent-fg: #ffffff;
  --accent-soft: #d4d0c8;
  --pane-active-ring: #000080;
  --bevel-raised: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040, inset 2px 2px 0 #dfdfdf, inset -2px -2px 0 #808080;
  --bevel-sunken: inset 1px 1px 0 #808080, inset -1px -1px 0 #ffffff, inset 2px 2px 0 #404040, inset -2px -2px 0 #dfdfdf;
}
html[data-preset="compact"][data-theme="dark"] {
  --bg: #26292e;
  --surface: #30343b;
  --surface-2: #24272c;
  --surface-well: #16181c;
  --surface-hover: #006d77;
  --header-bg: #292d33;
  --border: #4a4f58;
  --border-strong: #0c0d0f;
  --text: #e6e8ec;
  --text-muted: #a8aeb8;
  --accent: #008080;
  --accent-hover: #139a9a;
  --accent-fg: #ffffff;
  --accent-soft: #1f3b3b;
  --pane-active-ring: #2ab7b7;
  --bevel-raised: inset 1px 1px 0 #565b65, inset -1px -1px 0 #101215, inset 2px 2px 0 #3f444d, inset -2px -2px 0 #1c1f24;
  --bevel-sunken: inset 1px 1px 0 #121417, inset -1px -1px 0 #50555f, inset 2px 2px 0 #0b0c0e, inset -2px -2px 0 #343942;
}

/* ==========================================================================
   BASE & LAYOUT
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: var(--font-size);
  line-height: 1.38;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-muted); }
.small { font-size: var(--font-size-sm); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#app {
  display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden;
}

/* Top Chrome */
.topbar {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  padding: var(--pad-xs) var(--pad-sm);
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--bevel-raised);
  flex-shrink: 0;
  z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 6px; font-weight: 700; padding: 0 6px;
  letter-spacing: -0.01em;
}
.brand-dot {
  width: 10px; height: 10px; border-radius: var(--radius-pill); background: #ff0033;
  display: inline-block; flex-shrink: 0;
}
.topbar-sep {
  width: 1px; height: 20px; background: var(--border); margin: 0 2px;
}
.spacer { flex: 1; min-width: 6px; }

.nav-ribbon {
  display: flex; align-items: center; gap: var(--gap); overflow-x: auto;
  padding: var(--pad-xs) var(--pad-sm);
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* Controls */
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: var(--ctrl-h); padding: 0 var(--pad-sm);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-family: inherit; font-size: var(--font-size); font-weight: 500;
  cursor: pointer; white-space: nowrap; user-select: none;
  box-shadow: var(--bevel-raised);
}
button:hover:not(:disabled), .btn:hover {
  background: var(--surface-hover); border-color: var(--border-strong);
}
html[data-preset="compact"] button:hover:not(:disabled) {
  color: var(--text);
  background: var(--surface);
}
html[data-preset="compact"] button:active:not(:disabled) {
  box-shadow: var(--bevel-sunken);
  transform: translate(1px, 1px);
}
button:disabled { opacity: .48; cursor: not-allowed; }
button.sm { height: var(--ctrl-h-sm); padding: 0 7px; font-size: var(--font-size-sm); }
button.primary {
  background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
}
button.primary:hover:not(:disabled) {
  background: var(--accent-hover); border-color: var(--accent-hover);
}
button.danger {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
button.warn {
  background: var(--warning); color: #111; border-color: var(--warning);
}
button.active, .seg-btn.active {
  background: var(--accent-soft); color: var(--accent); border-color: var(--accent);
  font-weight: 600;
}
html[data-preset="compact"] button.active, html[data-preset="compact"] .seg-btn.active {
  background: var(--accent); color: var(--accent-fg); box-shadow: var(--bevel-sunken);
}
html[data-preset="modern"] .nav-btn.active {
  border-bottom: 2px solid var(--accent);
}
html[data-preset="touch"] button.pill, html[data-preset="touch"] .seg-group button {
  border-radius: var(--radius-pill);
}

.seg-group { display: inline-flex; gap: 2px; }

input, select, textarea {
  font-family: inherit; font-size: var(--font-size);
  color: var(--text);
  background: var(--surface-well, var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  box-shadow: var(--bevel-sunken);
}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select {
  height: var(--ctrl-h);
}
input.sm, select.sm { height: var(--ctrl-h-sm); font-size: var(--font-size-sm); padding: 2px 6px; }
textarea { padding: 6px 8px; resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent); outline-offset: -1px;
}
input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: var(--radius-pill);
  font-size: var(--font-size-sm); font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border);
}
.badge.ok { color: var(--success); border-color: var(--success); }
.badge.warn { color: var(--warning); border-color: var(--warning); }
.badge.bad { color: var(--danger); border-color: var(--danger); }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* Cards & Grids */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--pad-md);
  box-shadow: var(--shadow);
}
html[data-preset="compact"] .card {
  box-shadow: var(--bevel-raised);
}
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: var(--gap); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: var(--pad-md); }
.flex { display: flex; align-items: center; gap: var(--gap); }
.flex-col { display: flex; flex-direction: column; gap: var(--gap); }
.wrap { flex-wrap: wrap; }

/* ==========================================================================
   MULTI-PANE SPLIT WORKSPACE (1 TO 5 PANES + TABS)
   ========================================================================== */
#workspace {
  flex: 1; min-height: 0; padding: var(--gap);
  display: grid; gap: var(--gap); overflow: hidden;
}
#workspace[data-splits="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#workspace[data-splits="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
#workspace[data-splits="2v"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
#workspace[data-splits="3"] {
  grid-template-columns: 1.15fr 1fr; grid-template-rows: 1fr 1fr;
}
#workspace[data-splits="3"] .pane:nth-child(1) { grid-row: 1 / 3; }
#workspace[data-splits="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
#workspace[data-splits="5"] { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; }
#workspace[data-splits="5"] .pane:nth-child(1) { grid-column: 1 / 3; }
#workspace[data-splits="5"] .pane:nth-child(2) { grid-column: 3 / 5; }
#workspace[data-splits="5"] .pane:nth-child(3) { grid-column: 5 / 7; }
#workspace[data-splits="5"] .pane:nth-child(4) { grid-column: 1 / 4; }
#workspace[data-splits="5"] .pane:nth-child(5) { grid-column: 4 / 7; }

@media (max-width: 900px) {
  #workspace[data-splits="2"], #workspace[data-splits="3"],
  #workspace[data-splits="4"], #workspace[data-splits="5"] {
    grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: minmax(360px, 1fr);
    overflow-y: auto;
  }
  #workspace[data-splits="3"] .pane:nth-child(1),
  #workspace[data-splits="5"] .pane { grid-column: auto !important; grid-row: auto !important; }
}

.pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); overflow: hidden;
  box-shadow: var(--bevel-raised);
}
.pane.focused {
  border-color: var(--pane-active-ring);
  box-shadow: 0 0 0 2px var(--pane-active-ring), var(--bevel-raised);
}
.pane-header {
  display: flex; align-items: center; gap: 4px;
  background: var(--header-bg); border-bottom: 1px solid var(--border);
  padding: 3px 6px; flex-shrink: 0; overflow-x: auto;
}
html[data-preset="compact"] .pane.focused .pane-header {
  background: var(--accent); color: var(--accent-fg);
}
.pane-num {
  font-size: 10px; font-weight: 700; padding: 1px 5px;
  border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-muted);
  border: 1px solid var(--border);
}
.pane-tabs {
  display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow-x: auto;
}
.pane-tab {
  display: inline-flex; align-items: center; gap: 5px; max-width: 170px;
  height: var(--ctrl-h-sm); padding: 0 8px;
  border-radius: var(--radius-sm); border: 1px solid transparent;
  background: transparent; color: inherit; font-size: var(--font-size-sm);
  cursor: pointer; flex-shrink: 0;
}
.pane-tab.active {
  background: var(--surface); color: var(--text); border-color: var(--border);
  font-weight: 600;
}
.pane-tab .tab-close {
  opacity: .6; font-size: 11px; padding: 0 2px; border-radius: 3px;
}
.pane-tab .tab-close:hover { opacity: 1; background: rgba(224,27,36,.2); color: var(--danger); }

.pane-body {
  flex: 1; min-height: 0; overflow: auto; padding: var(--pad-md);
  background: var(--bg);
}

/* ==========================================================================
   YOUTUBE STUDIO TABLES & VIDEOS VIEW (MATCHING SCREENSHOT)
   ========================================================================== */
.yt-subtabs {
  display: flex; align-items: center; gap: 2px; overflow-x: auto;
  border-bottom: 1px solid var(--border); margin-bottom: var(--pad-sm);
  padding-bottom: 4px;
}
.yt-subtab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  padding: 4px 12px; height: var(--ctrl-h-sm); color: var(--text-muted);
  box-shadow: none;
}
.yt-subtab:hover { color: var(--text); background: var(--surface-2); }
.yt-subtab.active {
  color: var(--text); border-bottom-color: var(--accent); font-weight: 700;
  background: var(--surface);
}
.yt-filter-bar {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  padding: var(--pad-xs) var(--pad-sm); margin-bottom: var(--pad-sm);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
}

.studio-table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); overflow: auto;
  box-shadow: var(--bevel-sunken);
}
table.studio-table {
  width: 100%; border-collapse: collapse; text-align: left;
  font-size: var(--font-size);
}
table.studio-table thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface); color: var(--text-muted);
  font-size: var(--font-size-sm); font-weight: 600;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap; user-select: none;
}
table.studio-table th.sortable { cursor: pointer; }
table.studio-table th.sortable:hover { color: var(--text); }
table.studio-table tbody tr {
  border-bottom: 1px solid var(--border);
}
table.studio-table tbody tr:hover { background: var(--surface-2); }
table.studio-table tbody tr.selected-row { background: var(--accent-soft); }
table.studio-table td {
  padding: var(--row-py) 10px; vertical-align: middle;
}
.vid-cell { display: flex; align-items: flex-start; gap: 12px; min-width: 280px; max-width: 540px; }
.thumb-box {
  position: relative; width: 120px; height: 68px; flex-shrink: 0;
  background: #111; border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--border);
}
.thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-dur {
  position: absolute; right: 4px; bottom: 4px;
  background: rgba(0,0,0,.82); color: #fff;
  font-size: 11px; font-weight: 600; padding: 1px 4px; border-radius: 3px;
  font-family: var(--font-mono);
}
.vid-meta { min-width: 0; flex: 1; }
.vid-title {
  font-weight: 600; color: var(--text); margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.vid-desc {
  color: var(--text-muted); font-size: var(--font-size-sm);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row-actions {
  display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap;
}
.num-col { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ==========================================================================
   CHARTS & ANALYTICS
   ========================================================================== */
.analytics-nav {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--pad-md);
  padding: var(--pad-sm); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md);
}
.analytics-nav button {
  font-weight: 600;
}
.chart-box {
  position: relative; width: 100%; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--pad-md);
}
.chart-svg { width: 100%; height: 240px; display: block; overflow: visible; }
.chart-tooltip {
  position: absolute; pointer-events: none; z-index: 10;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 6px 8px; font-size: var(--font-size-sm); box-shadow: var(--shadow);
  display: none; white-space: nowrap;
}
.bar-track {
  height: 8px; background: var(--surface-2); border-radius: var(--radius-pill);
  overflow: hidden; min-width: 80px;
}
.bar-fill { height: 100%; background: var(--accent); }

/* ==========================================================================
   STATUS BAR, MODALS & TOASTS
   ========================================================================== */
.statusbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 3px 10px; font-size: var(--font-size-sm);
  background: var(--header-bg); border-top: 1px solid var(--border);
  color: var(--text-muted); flex-shrink: 0;
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.58);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(860px, 100%); max-height: 90vh; display: flex; flex-direction: column;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  box-shadow: 0 18px 48px rgba(0,0,0,.45), var(--bevel-raised);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--header-bg); border-bottom: 1px solid var(--border);
  font-weight: 700;
}
html[data-preset="compact"] .modal-head { background: var(--accent); color: var(--accent-fg); }
.modal-body { padding: 14px; overflow: auto; flex: 1; }
.cmd-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 360px; overflow: auto; }
.cmd-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid transparent;
}
.cmd-item:hover, .cmd-item.selected {
  background: var(--accent-soft); border-color: var(--accent);
}
#toasts {
  position: fixed; right: 14px; bottom: 34px; z-index: 200;
  display: flex; flex-direction: column; gap: 6px; max-width: 380px;
}
.toast {
  padding: 8px 12px; border-radius: var(--radius-md);
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-left: 4px solid var(--accent);
  box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: var(--font-size-sm);
}
.toast.ok { border-left-color: var(--success); }
.toast.warn { border-left-color: var(--warning); }
.toast.err { border-left-color: var(--danger); }

.dropzone {
  border: 2px dashed var(--border-strong); border-radius: var(--radius-md);
  padding: 18px; text-align: center; cursor: pointer;
  background: var(--surface);
}
.dropzone.dragover { border-color: var(--accent); background: var(--accent-soft); }
.frame-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.frame-card {
  position: relative; width: 132px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); overflow: hidden; cursor: pointer;
}
.frame-card.selected { border-color: var(--accent); }
.frame-card img { width: 100%; height: 74px; object-fit: cover; display: block; }
.frame-card span {
  display: block; font-size: 10px; text-align: center; padding: 2px; background: var(--surface-2);
}

.kbd {
  display: inline-block; padding: 1px 5px; font-family: var(--font-mono);
  font-size: 10.5px; border: 1px solid var(--border-strong);
  border-radius: 3px; background: var(--surface-2); color: var(--text);
}

  const BlobStore = (() => {
    let dbPromise = null;
    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open('ytdeck_blobs_v1', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
      return dbPromise;
    }
    async function put(key, blobOrDataUrl) {
      const db = await open();
      if (!db) { try { sessionStorage.setItem('blob_' + key, blobOrDataUrl); } catch {} return; }
      return new Promise((res) => {
        const tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').put(blobOrDataUrl, key);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      });
    }
    async function get(key) {
      const db = await open();
      if (!db) return sessionStorage.getItem('blob_' + key);
      return new Promise((res) => {
        const tx = db.transaction('blobs', 'readonly');
        const r = tx.objectStore('blobs').get(key);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => res(null);
      });
    }
    async function del(key) {
      const db = await open();
      if (!db) { sessionStorage.removeItem('blob_' + key); return; }
      return new Promise((res) => {
        const tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').delete(key);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      });
    }
    return { put, get, del };

        if (k && k.startsWith(LS.CACHE_PREFIX)) {

  /* ==========================================================================
     5. UTILITIES (ESCAPING, DURATIONS, FORMATTERS, TOASTS)
     ========================================================================== */
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmtNum(n) {
    const num = Number(n || 0);
    return Number.isFinite(num) ? num.toLocaleString() : '0';
  }
  function fmtDurationISO(iso) {
    if (!iso) return '0:00';
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return '0:00';
    const h = Number(m[1] || 0), min = Number(m[2] || 0), s = Number(m[3] || 0);
    const pad = x => String(x).padStart(2, '0');
    return h ? `${h}:${pad(min)}:${pad(s)}` : `${min}:${pad(s)}`;
  }
  function durationSeconds(iso) {
    if (!iso) return 0;
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return 0;
    return Number(m[1] || 0) * 3600 + Number(m[2] || 0) * 60 + Number(m[3] || 0);
  }
  function fmtSecs(sec) {
    sec = Math.max(0, Math.round(Number(sec || 0)));
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  function fmtDateShort(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtAge(ts) {
    if (!ts) return 'never';
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    return `${Math.floor(s / 3600)}h ago`;
  }
  function isCacheFresh(ts) {
    if (!ts) return false;
    return (Date.now() - ts) < (State.prefs.cacheTtlMinutes * 60 * 1000);
  }
  function toast(msg, kind = 'info', ms = 3600) {
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    document.getElementById('status-msg').textContent = msg;
    setTimeout(() => el.remove(), ms);
  }
  function videoLooksShort(v) {
    const sec = durationSeconds(v.contentDetails?.duration);
    const txt = ((v.snippet?.title || '') + ' ' + (v.snippet?.description || '')).toLowerCase();
    return (sec > 0 && sec <= 180) && (txt.includes('#shorts') || sec <= 60);
  }
  function getVideoNotices(v) {
    const n = [];
    if (v.status?.madeForKids || v.status?.selfDeclaredMadeForKids) n.push('Made for kids');
    if (v.status?.uploadStatus && v.status.uploadStatus !== 'processed') n.push(v.status.uploadStatus);
    if (v.status?.embeddable === false) n.push('No embed');
    if (v.status?.publishAt && v.status?.privacyStatus === 'private') n.push('Scheduled');
    return n.length ? n.join(', ') : '—';
  }
  function localStorageBytes() {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      total += (k.length + (localStorage.getItem(k) || '').length) * 2;
    }
    return total;
  }

  /* ==========================================================================
     6. TITLE & DESCRIPTION PRESET RULE ENGINE ([YTP] %t %s ... $src)
     ========================================================================== */
  function extractPresetVars(ruleStr) {
    const set = new Set();
    const re = /\$([a-zA-Z_][a-zA-Z0-9_]*)/g;
    let m;
    while ((m = re.exec(ruleStr || '')) !== null) set.add(m[1]);
    return Array.from(set);
  }
  function applyTitleDescPreset(ruleStr, rawTitle, rawDesc, varsMap, channelName = '') {
    let out = String(ruleStr || '%t %s %d');
    const today = pacificDateStr();
    const rep = (s) => s
      .replace(/%t/g, rawTitle || '')
      .replace(/%d/g, rawDesc || '')
      .replace(/%date/g, today)
      .replace(/%channel/g, channelName || '')
      .replace(/\$([a-zA-Z_][a-zA-Z0-9_]*)/g, (_, name) => varsMap[name] ?? '');

    if (out.includes('%s')) {
      const idx = out.indexOf('%s');
      const titleTpl = out.slice(0, idx);
      const descTpl = out.slice(idx + 2);
      const title = rep(titleTpl).replace(/\s+/g, ' ').trim();
      let desc = rep(descTpl).replace(/^\s+/, '');
      if (rawDesc && !descTpl.includes('%d')) {
        desc = desc ? `${desc}\n\n${rawDesc}` : rawDesc;
      }
      return { title, description: desc.trim() };
    } else {
      return {
        title: rep(out).replace(/\s+/g, ' ').trim(),
        description: rawDesc || ''
      };
    }
  }
  function validateYouTubeMetadata(title, desc, tagsArr) {
    const issues = [];
    if (!title || !title.trim()) issues.push('Title is required.');
    if (title.length > 100) issues.push(`Title exceeds 100 chars (${title.length}/100).`);
    if (/[<>]/.test(title)) issues.push('Title cannot contain < or >.');
    if (/[<>]/.test(desc)) issues.push('Description cannot contain < or >.');
    if (new Blob([desc]).size > 5000) issues.push('Description exceeds 5,000 bytes.');
    const tagsJoined = (tagsArr || []).join(',');
    if (tagsJoined.length > 500) issues.push(`Tags exceed 500 chars (${tagsJoined.length}/500).`);
    if (/[<>]/.test(tagsJoined)) issues.push('Tags cannot contain < or >.');
    return issues;
  }

  /* ==========================================================================
     7. OAUTH2 (GOOGLE IDENTITY SERVICES) & VERIFIED API CLIENT
     ========================================================================== */
  function requestedScopes() {
    const p = activeProfile();
    const sc = [...BASE_SCOPES];
    if (State.prefs.includeMonetaryScope || (p && p.includeMonetary)) sc.push(MONETARY_SCOPE);
    return sc.join(' ');
  }

  function currentRedirectUri() {
    return window.location.origin + window.location.pathname;
  }

  function restoreOrConsumeOAuthToken() {
    const rawHash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
    if (rawHash && (rawHash.includes('access_token=') || rawHash.includes('error='))) {
      const hp = new URLSearchParams(rawHash);
      history.replaceState(null, '', window.location.pathname + window.location.search);

      const pending = safeJsonParse(localStorage.getItem('ytdeck_oauth_pending'), null);
      localStorage.removeItem('ytdeck_oauth_pending');

      const oauthErr = hp.get('error');
      if (oauthErr) {
        setTimeout(() => toast(`OAuth error: ${hp.get('error_description') || oauthErr}`, 'err', 6000), 100);
        return;
      }
      if (!pending || pending.expiresAt < Date.now() || pending.state !== hp.get('state')) {
        const why = !pending ? 'missing pending state' : pending.expiresAt < Date.now() ? 'expired' : 'mismatch';
        setTimeout(() => toast(`OAuth state error (${why}) — please click Sign In again.`, 'err', 6000), 100);
        return;
      }
      const token = hp.get('access_token');
      const expiresIn = Number(hp.get('expires_in') || 3600);
      if (token) {
        if (pending.accountId) {
          State.accounts.activeId = pending.accountId;
          lsSet(LS.ACCOUNTS, State.accounts);
        }
        State.auth.accessToken = token;
        State.auth.expiresAt = Date.now() + (expiresIn * 1000);
        State.auth.grantedScope = hp.get('scope') || '';
        sessionStorage.setItem('ytdeck_tok_' + activeProfile().id, JSON.stringify({
          accessToken: token, expiresAt: State.auth.expiresAt, grantedScope: State.auth.grantedScope
        }));
        setTimeout(async () => {
          toast('Signed in with Google OAuth2 (Redirect)!', 'ok');
          try { await syncChannelAndVideos(true); renderWorkspace(); }
          catch (e) { toast(e.message, 'err', 6000); }
        }, 120);
        return;
      }
    }

    const prof = activeProfile();
    if (prof && !prof.isDemo) {
      const saved = safeJsonParse(sessionStorage.getItem('ytdeck_tok_' + prof.id), null);
      if (saved && saved.accessToken && saved.expiresAt > Date.now() + 15000) {
        State.auth.accessToken = saved.accessToken;
        State.auth.expiresAt = saved.expiresAt;
        State.auth.grantedScope = saved.grantedScope || '';
      }
    }
  }

  function triggerOAuthSignIn(promptMode = 'select_account') {
    const prof = activeProfile();
    if (!prof || prof.isDemo || !prof.clientId) {
      toast('Add a non-demo Account Profile with your Google OAuth Client ID in Setup & Settings first.', 'warn', 5000);
      State.prefs.setupDismissed = false; savePrefs(); renderOnboardingGuide();
      openViewInFocusedPane('accounts_settings');
      return;
    }

    // Firefox-safe Same-Tab OAuth Redirect (default)
    if ((State.prefs.authMode || 'redirect') === 'redirect') {
      const stateToken = 'st_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      lsSet('ytdeck_oauth_pending', {
        state: stateToken,
        accountId: prof.id,
        expiresAt: Date.now() + 15 * 60 * 1000
      });
      const params = new URLSearchParams({
        client_id: prof.clientId.trim(),
        redirect_uri: currentRedirectUri(),
        response_type: 'token',
        scope: requestedScopes(),
        include_granted_scopes: 'true',
        state: stateToken,
        prompt: promptMode
      });
      window.location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + params.toString());
      return;
    }

    // Optional GIS Popup Mode
    if (!window.google?.accounts?.oauth2) {
      toast('GIS script blocked/unloaded — switch Auth Mode to "Same-Tab Redirect" in Settings.', 'err', 5000);
      return;
    }
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: prof.clientId.trim(),
        scope: requestedScopes(),
        callback: async (resp) => {
          if (resp.error) {
            toast(`OAuth error: ${resp.error_description || resp.error}`, 'err', 5000);
            return;
          }
          State.auth.accessToken = resp.access_token;
          State.auth.expiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
          State.auth.grantedScope = resp.scope || '';
          sessionStorage.setItem('ytdeck_tok_' + prof.id, JSON.stringify({
            accessToken: resp.access_token, expiresAt: State.auth.expiresAt, grantedScope: State.auth.grantedScope
          }));
          toast('Signed in with Google OAuth2!', 'ok');
          updateAuthChrome();
          await syncChannelAndVideos(true);
          renderWorkspace();
        },
        error_callback: (err) => {
          toast(`Popup blocked/failed (${err.type || 'unknown'}). Use Same-Tab Redirect in Settings.`, 'err', 5000);
        }
      });
      State.auth.tokenClient = client;
      client.requestAccessToken({ prompt: promptMode });
    } catch (e) {
      toast('OAuth initialization failed: ' + e.message, 'err');
    }
  }

  async function apiFetch(url, options = {}, quotaUnits = 1, isUpload = false) {
    if (isDemoMode()) throw new Error('In Demo Mode — sign in with OAuth2 to call live Google APIs.');
    if (Date.now() > State.auth.expiresAt - 15000) {
      throw new Error('OAuth2 token expired. Click "Sign In / Refresh Token" in top bar.');
    }
    addQuota(quotaUnits, isUpload);
    const headers = Object.assign({ 'Authorization': 'Bearer ' + State.auth.accessToken }, options.headers || {});
    const res = await fetch(url, Object.assign({}, options, { headers }));
    if (res.status === 401) {
      State.auth.accessToken = null;
      State.auth.expiresAt = 0;
      updateAuthChrome();
      throw new Error('401 Unauthorized — OAuth token expired/revoked. Re-sign in.');
    }
    if (res.status === 204) return null;
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const msg = json?.error?.message || text || `HTTP ${res.status}`;
      const err = new Error(msg);
      err.status = res.status;
      err.payload = json;
      throw err;
    }
    return json;
  }

  async function syncChannelAndVideos(force = false) {
    if (isDemoMode()) { toast('Demo channel active (localStorage sandbox).', 'info'); return; }
    const cache = getChannelCache();
    if (!force && cache.channel && isCacheFresh(cache.ts.channel) && cache.videos.length && isCacheFresh(cache.ts.videos)) {
      toast('Loaded channel & videos from localStorage cache (0 API units spent).', 'ok');
      return;
    }
    toast('Syncing channel & uploads via playlistItems + videos.list...', 'info');
    const chData = await apiFetch(
      `${YT_DATA_BASE}/channels?part=snippet,contentDetails,statistics,brandingSettings,status&mine=true`,
      {}, 1
    );
    const channel = chData?.items?.[0];
    if (!channel) throw new Error('No YouTube channel linked to this Google account.');
    cache.channel = channel;
    cache.ts.channel = Date.now();

    // Update profile channelId so cache is keyed per channel!
    const prof = activeProfile();
    if (prof && prof.channelId !== channel.id) {
      prof.channelId = channel.id;
      prof.label = channel.snippet?.title || prof.label;
      lsSet(LS.ACCOUNTS, State.accounts);
      renderAccountSelect();
    }

    const uploadsId = channel.contentDetails?.relatedPlaylists?.uploads;
    const videoIds = [];
    let pageToken = '';
    let pages = 0;
    if (uploadsId) {
      do {
        const plUrl = `${YT_DATA_BASE}/playlistItems?part=snippet,contentDetails,status&playlistId=${encodeURIComponent(uploadsId)}&maxResults=50${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
        const pl = await apiFetch(plUrl, {}, 1);
        for (const it of (pl?.items || [])) {
          const vid = it.contentDetails?.videoId;
          if (vid) videoIds.push(vid);
        }
        pageToken = pl?.nextPageToken || '';
        pages++;
      } while (pageToken && pages < 10); // up to 500 recent videos safely
    }

    const fullVideos = [];
    for (let i = 0; i < videoIds.length; i += 50) {
      const chunk = videoIds.slice(i, i + 50).join(',');
      const vRes = await apiFetch(
        `${YT_DATA_BASE}/videos?part=snippet,contentDetails,statistics,status,liveStreamingDetails&id=${encodeURIComponent(chunk)}`,
        {}, 1
      );
      if (vRes?.items) fullVideos.push(...vRes.items);
    }
    cache.videos = fullVideos;
    cache.ts.videos = Date.now();

    // Also fetch playlists (1 unit)
    try {
      const pls = await apiFetch(`${YT_DATA_BASE}/playlists?part=snippet,contentDetails,status&mine=true&maxResults=50`, {}, 1);
      cache.playlists = pls?.items || [];
      cache.ts.playlists = Date.now();
    } catch (e) { console.warn('Playlists fetch skipped:', e); }

    saveChannelCache(cache);
    toast(`Synced ${fullVideos.length} videos & cached in localStorage.`, 'ok');
  }

  async function syncComments(force = false) {
    const cache = getChannelCache();
    if (isDemoMode()) return cache.comments || [];
    if (!force && cache.comments?.length && isCacheFresh(cache.ts.comments)) return cache.comments;

    const f = State.runtime.commentFilter;
    const params = new URLSearchParams({
      part: 'snippet,replies',
      maxResults: '100',
      order: f.order || 'time',
      textFormat: 'plainText'
    });
    if (f.mode === 'video' && f.videoId) {
      params.set('videoId', f.videoId);
      if (f.moderation) params.set('moderationStatus', f.moderation);
    } else {
      const chId = cache.channel?.id;
      if (!chId) throw new Error('Sync channel first.');
      params.set('allThreadsRelatedToChannelId', chId);
      if (f.moderation) params.set('moderationStatus', f.moderation);
    }
    const res = await apiFetch(`${YT_DATA_BASE}/commentThreads?${params.toString()}`, {}, 1);
    const items = res?.items || [];
    // If fetching published default, update main cache
    if (f.mode === 'channel' && f.moderation === 'published') {
      cache.comments = items;
      cache.ts.comments = Date.now();
      saveChannelCache(cache);
    }
    return items;
  }

  async function queryAnalyticsReport(spec, force = false) {
    const cache = getChannelCache();
    const cacheKey = JSON.stringify(spec);
    if (isDemoMode()) return getDemoAnalyticsReport(spec);
    if (!force && cache.analytics?.[cacheKey] && isCacheFresh(cache.analytics[cacheKey].ts)) {
      return cache.analytics[cacheKey].data;
    }

    const buildParams = (metricsList) => {
      const p = new URLSearchParams({
        ids: 'channel==MINE',
        startDate: spec.startDate,
        endDate: spec.endDate,
        metrics: metricsList.join(',')
      });
      if (spec.dimensions) p.set('dimensions', spec.dimensions);
      if (spec.filters) p.set('filters', spec.filters);
      if (spec.sort) p.set('sort', spec.sort);
      if (spec.maxResults) p.set('maxResults', String(spec.maxResults));
      return p.toString();
    };

    try {
      const data = await apiFetch(`${YT_ANALYTICS_URL}?${buildParams(spec.metrics)}`, {}, 1);
      cache.analytics = cache.analytics || {};
      cache.analytics[cacheKey] = { ts: Date.now(), data };
      saveChannelCache(cache);
      return data;
    } catch (err) {
      // Automatic fallback if a non-core metric triggers 400 badRequest on a particular dimension/channel
      if (err.status === 400 && spec.fallbackMetrics && spec.fallbackMetrics.length) {
        const fbMetrics = Array.from(new Set(spec.fallbackMetrics));
        let fbSort = spec.sort;
        if (fbSort && !fbMetrics.includes(fbSort.replace(/^-/, ""))) fbSort = "-" + fbMetrics[0];
        const p2 = new URLSearchParams({ ids: "channel==MINE", startDate: spec.startDate, endDate: spec.endDate, metrics: fbMetrics.join(",") });
        if (spec.dimensions) p2.set("dimensions", spec.dimensions);
        if (spec.filters) p2.set("filters", spec.filters);
        if (fbSort) p2.set("sort", fbSort);
        if (spec.maxResults) p2.set("maxResults", String(spec.maxResults));
        const data = await apiFetch(`${YT_ANALYTICS_URL}?${p2.toString()}`, {}, 1);
        cache.analytics = cache.analytics || {};
        cache.analytics[cacheKey] = { ts: Date.now(), data };
        saveChannelCache(cache);
        return data;
      }
      throw err;
    }
  }

  function getDemoAnalyticsReport(spec) {
    const dims = spec.dimensions || '';
    if (dims === 'day') {
      return {
        columnHeaders: [
          { name: 'day' }, { name: 'views' }, { name: 'estimatedMinutesWatched' },
          { name: 'averageViewDuration' }, { name: 'averageViewPercentage' },
          { name: 'likes' }, { name: 'dislikes' }, { name: 'comments' },
          { name: 'shares' }, { name: 'subscribersGained' }, { name: 'subscribersLost' }
        ],
        rows: DEMO.dailyRows
      };

  /* ==========================================================================
     8. AGGRESSIVE WRITE BUFFER & COALESCING ENGINE
     ========================================================================== */
  let autoFlushTimer = null;

  function enqueueWrite(op) {
    const queue = getWriteQueue();
    const id = op.id || ('op_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
    const entry = Object.assign({ id, createdAt: Date.now(), updatedAt: Date.now() }, op);

    // Coalesce video metadata edits per videoId -> turns 10 edits into ONE 50-unit PUT!
    if (entry.type === 'video.update') {
      const idx = queue.findIndex(x => x.type === 'video.update' && x.videoId === entry.videoId);
      if (idx >= 0) {
        const prev = queue[idx];
        queue[idx] = {
          ...prev,
          updatedAt: Date.now(),
          snippetPatch: { ...(prev.snippetPatch || {}), ...(entry.snippetPatch || {}) },
          statusPatch: { ...(prev.statusPatch || {}), ...(entry.statusPatch || {}) },
          summary: entry.summary || prev.summary
        };
        saveWriteQueue(queue);
        toast(`Coalesced edit for ${entry.videoId} in Write Buffer (saves 50 units!).`, 'ok');
        scheduleAutoFlushIfEnabled();
        return;
      }
    }

    // Coalesce thumbnail sets per videoId
    if (entry.type === 'thumbnail.set') {
      const idx = queue.findIndex(x => x.type === 'thumbnail.set' && x.videoId === entry.videoId);
      if (idx >= 0) {
        queue[idx] = { ...queue[idx], ...entry, updatedAt: Date.now() };
        saveWriteQueue(queue);
        toast(`Updated staged thumbnail for ${entry.videoId}.`, 'ok');
        scheduleAutoFlushIfEnabled();
        return;
      }
    }

    queue.push(entry);
    saveWriteQueue(queue);
    toast(`Buffered "${entry.summary || entry.type}" into Write Queue.`, 'ok');
    scheduleAutoFlushIfEnabled();
  }

  function scheduleAutoFlushIfEnabled() {
    clearTimeout(autoFlushTimer);
    const sec = Number(State.prefs.autoFlushSeconds || 0);
    if (sec > 0) {
      autoFlushTimer = setTimeout(() => flushWriteQueue(), sec * 1000);
    }
  }

  function updateQueueChrome() {
    const q = getWriteQueue();
    const c = document.getElementById('queue-count');
    const f = document.getElementById('btn-flush-now');
    if (c) c.textContent = String(q.length);
    if (f) f.style.display = q.length ? 'inline-flex' : 'none';
  }

  async function executeSingleWriteOp(op) {
    const cache = getChannelCache();
    if (isDemoMode()) {
      // Simulate write locally on Demo Sandbox!
      if (op.type === 'video.update') {
        const v = cache.videos.find(x => x.id === op.videoId);
        if (v) {
          Object.assign(v.snippet, op.snippetPatch || {});
          Object.assign(v.status, op.statusPatch || {});
        }
      } else if (op.type === 'thumbnail.set') {
        const blobUrl = await BlobStore.get(op.blobKey);
        const v = cache.videos.find(x => x.id === op.videoId);
        if (v && blobUrl) {
          v.snippet.thumbnails = v.snippet.thumbnails || {};
          v.snippet.thumbnails.medium = { url: blobUrl };
          v.snippet.thumbnails.high = { url: blobUrl };
        }
        if (op.blobKey) await BlobStore.del(op.blobKey);
      } else if (op.type === 'video.delete') {
        cache.videos = cache.videos.filter(x => x.id !== op.videoId);
      } else if (op.type === 'playlist.add') {
        const pl = cache.playlists.find(x => x.id === op.playlistId);
        if (pl) pl.contentDetails.itemCount = Number(pl.contentDetails.itemCount || 0) + 1;
      } else if (op.type === 'comment.reply') {
        const th = cache.comments.find(t => t.snippet?.topLevelComment?.id === op.parentId || t.id === op.parentId);
        if (th) {
          th.replies = th.replies || { comments: [] };
          th.replies.comments.push({
            id: 'demo_rep_' + Date.now(),
            snippet: {
              authorDisplayName: cache.channel?.snippet?.customUrl || '@You',
              textOriginal: op.text, likeCount: 0, publishedAt: new Date().toISOString()
            }
          });
          th.snippet.totalReplyCount = Number(th.snippet.totalReplyCount || 0) + 1;
        }
      } else if (op.type === 'comment.moderate') {
        cache.comments.forEach(t => {
          if (t.snippet?.topLevelComment?.id === op.commentId) {
            t.snippet.topLevelComment.snippet.moderationStatus = op.moderationStatus;
          }
        });
      } else if (op.type === 'comment.spam' || op.type === 'comment.delete') {
        cache.comments = cache.comments.filter(t => t.snippet?.topLevelComment?.id !== op.commentId);
      } else if (op.type === 'comment.top') {
        cache.comments.unshift({ id: 'demo_t_' + Date.now(), snippet: { videoId: op.videoId, canReply: true, totalReplyCount: 0, topLevelComment: { id: 'demo_c_' + Date.now(), snippet: { authorDisplayName: cache.channel?.snippet?.customUrl || '@You', textOriginal: op.text, likeCount: 0, publishedAt: new Date().toISOString(), moderationStatus: 'published' } } }, replies: { comments: [] } });
      } else if (op.type === 'comment.edit') {
        cache.comments.forEach(t => { if (t.snippet?.topLevelComment?.id === op.commentId) t.snippet.topLevelComment.snippet.textOriginal = op.text; (t.replies?.comments || []).forEach(r => { if (r.id === op.commentId) r.snippet.textOriginal = op.text; }); });
      } else if (op.type === 'playlist.create') {
        cache.playlists.unshift({ id: 'PL_' + Date.now(), snippet: { title: op.title, description: op.description || '' }, contentDetails: { itemCount: 0 }, status: { privacyStatus: op.privacyStatus || 'public' } });
      } else if (op.type === 'playlist.delete') {
        cache.playlists = (cache.playlists || []).filter(p => p.id !== op.playlistId);
      } else if (op.type === 'channel.branding') {
        cache.channel.brandingSettings = cache.channel.brandingSettings || { channel: {} };
        Object.assign(cache.channel.brandingSettings.channel, op.brandingPatch || {});
      }
      saveChannelCache(cache);
      return;
    }

    // LIVE YOUTUBE DATA API V3 WRITES
    if (op.type === 'video.update') {
      // Fetch authoritative current snippet & status so PUT /videos never clears untouched fields!
      let current = cache.videos.find(x => x.id === op.videoId);
      const fresh = await apiFetch(
        `${YT_DATA_BASE}/videos?part=snippet,status&id=${encodeURIComponent(op.videoId)}`,
        {}, 1
      );
      if (fresh?.items?.[0]) current = fresh.items[0];
      if (!current) throw new Error(`Video ${op.videoId} not found.`);

      const mergedSnippet = {
        title: op.snippetPatch?.title ?? current.snippet.title,
        description: op.snippetPatch?.description ?? current.snippet.description ?? '',
        categoryId: op.snippetPatch?.categoryId ?? current.snippet.categoryId ?? State.prefs.defaultCategoryId ?? '24',
        tags: op.snippetPatch?.tags ?? current.snippet.tags
      };
      const nextLang = op.snippetPatch?.defaultLanguage !== undefined ? op.snippetPatch.defaultLanguage : current.snippet.defaultLanguage;
      if (nextLang) mergedSnippet.defaultLanguage = nextLang;

      const mergedStatus = {
        privacyStatus: op.statusPatch?.privacyStatus ?? current.status.privacyStatus,
        embeddable: op.statusPatch?.embeddable ?? current.status.embeddable ?? true,
        license: op.statusPatch?.license ?? current.status.license ?? 'youtube',
        publicStatsViewable: op.statusPatch?.publicStatsViewable ?? current.status.publicStatsViewable ?? true,
        selfDeclaredMadeForKids: op.statusPatch?.selfDeclaredMadeForKids ?? current.status.madeForKids ?? false
      };
      // Only include publishAt when private and explicitly set
      const pubAt = op.statusPatch?.publishAt !== undefined ? op.statusPatch.publishAt : current.status.publishAt;
      if (mergedStatus.privacyStatus === 'private' && pubAt) {
        mergedStatus.publishAt = pubAt;
      }

      const updated = await apiFetch(`${YT_DATA_BASE}/videos?part=snippet,status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: op.videoId, snippet: mergedSnippet, status: mergedStatus })
      }, 50);

      const idx = cache.videos.findIndex(x => x.id === op.videoId);
      if (idx >= 0 && updated) {
        cache.videos[idx] = { ...cache.videos[idx], snippet: updated.snippet, status: updated.status };
      }
      saveChannelCache(cache);
      return;
    }

    if (op.type === 'thumbnail.set') {
      const dataUrl = await BlobStore.get(op.blobKey);
      if (!dataUrl) throw new Error('Thumbnail blob expired or missing.');
      const blob = await (await fetch(dataUrl)).blob();
      addQuota(50);
      const res = await fetch(`${YT_UPLOAD_THUMB}?videoId=${encodeURIComponent(op.videoId)}&uploadType=media`, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + State.auth.accessToken,
          'Content-Type': blob.type || 'image/jpeg'
        },
        body: blob
      });
      if (!res.ok) throw new Error(`thumbnails.set failed: ${await res.text()}`);
      const json = await res.json();
      const v = cache.videos.find(x => x.id === op.videoId);
      if (v && json?.items?.[0]) v.snippet.thumbnails = json.items[0];
      saveChannelCache(cache);
      await BlobStore.del(op.blobKey);
      return;
    }

    if (op.type === 'video.delete') {
      await apiFetch(`${YT_DATA_BASE}/videos?id=${encodeURIComponent(op.videoId)}`, { method: 'DELETE' }, 50);
      cache.videos = cache.videos.filter(x => x.id !== op.videoId);
      saveChannelCache(cache);
      return;
    }

    if (op.type === 'playlist.add') {
      await apiFetch(`${YT_DATA_BASE}/playlistItems?part=snippet`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          snippet: { playlistId: op.playlistId, resourceId: { kind: 'youtube#video', videoId: op.videoId } }
        })
      }, 50);
      return;
    }

    if (op.type === 'comment.reply') {
      await apiFetch(`${YT_DATA_BASE}/comments?part=snippet`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ snippet: { parentId: op.parentId, textOriginal: op.text } })
      }, 50);
      return;
    }

    if (op.type === 'comment.moderate') {
      const p = new URLSearchParams({
        id: op.commentId,
        moderationStatus: op.moderationStatus,
        banAuthor: op.banAuthor ? 'true' : 'false'
      });
      await apiFetch(`${YT_DATA_BASE}/comments/setModerationStatus?${p.toString()}`, { method: 'POST' }, 50);
      return;
    }

    if (op.type === 'comment.spam') {
      await apiFetch(`${YT_DATA_BASE}/comments/markAsSpam?id=${encodeURIComponent(op.commentId)}`, { method: 'POST' }, 50);
      return;
    }

    if (op.type === 'comment.delete') {
      await apiFetch(`${YT_DATA_BASE}/comments?id=${encodeURIComponent(op.commentId)}`, { method: 'DELETE' }, 50);
    }
    if (op.type === 'comment.top') {
      await apiFetch(`${YT_DATA_BASE}/commentThreads?part=snippet`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ snippet: { videoId: op.videoId, topLevelComment: { snippet: { textOriginal: op.text } } } }) }, 50);
      return;
    }
    if (op.type === 'comment.edit') {
      await apiFetch(`${YT_DATA_BASE}/comments?part=snippet`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: op.commentId, snippet: { textOriginal: op.text } }) }, 50);
      return;
    }
    if (op.type === 'playlist.create') {
      const created = await apiFetch(`${YT_DATA_BASE}/playlists?part=snippet,status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ snippet: { title: op.title, description: op.description || '' }, status: { privacyStatus: op.privacyStatus || 'public' } }) }, 50);
      if (created) { cache.playlists = [created, ...(cache.playlists || [])]; saveChannelCache(cache); }
      return;
    }
    if (op.type === 'playlist.delete') {
      await apiFetch(`${YT_DATA_BASE}/playlists?id=${encodeURIComponent(op.playlistId)}`, { method: 'DELETE' }, 50);
      cache.playlists = (cache.playlists || []).filter(p => p.id !== op.playlistId); saveChannelCache(cache);
      return;
    }
    if (op.type === 'channel.branding') {
      const chRes = await apiFetch(`${YT_DATA_BASE}/channels?part=brandingSettings&mine=true`, {}, 1);
      const ch = chRes?.items?.[0]; if (!ch) throw new Error('Channel not found');
      const bs = ch.brandingSettings || { channel: {} };
      const nextCh = { ...(bs.channel || {}), ...(op.brandingPatch || {}) };
      if (ch.snippet?.title) nextCh.title = ch.snippet.title;
      const upd = await apiFetch(`${YT_DATA_BASE}/channels?part=brandingSettings`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ch.id, brandingSettings: { ...bs, channel: nextCh } }) }, 50);
      if (upd?.brandingSettings && cache.channel) { cache.channel.brandingSettings = upd.brandingSettings; saveChannelCache(cache); }
    }
  }

  async function flushWriteQueue() {
    const queue = getWriteQueue();
    if (!queue.length) { toast('Write Buffer is empty.', 'info'); return; }
    let done = 0;
    const remaining = [];
    for (let i = 0; i < queue.length; i++) {
      const op = queue[i];
      try {
        await executeSingleWriteOp(op);
        done++;
      } catch (err) {
        op.lastError = err.message;
        remaining.push(op);
        toast(`Op failed (${op.summary || op.type}): ${err.message}`, 'err', 5000);
      }
    }
    saveWriteQueue(remaining);
    toast(`Flushed ${done} write(s). ${remaining.length ? remaining.length + ' failed/kept.' : 'Buffer clean!'}`, remaining.length ? 'warn' : 'ok');
    renderWorkspace();
  }

  /* ==========================================================================
     9. GEMINI NANO BANANA 2 LITE THUMBNAIL ENGINE
     ========================================================================== */
  async function extractVideoFramesFromFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const vid = document.createElement('video');
      vid.muted = true;
      vid.playsInline = true;
      vid.preload = 'metadata';
      vid.src = url;
      vid.onloadedmetadata = async () => {
        try {
          const dur = Math.max(0.5, vid.duration || 1);
          const times = [dur * 0.12, dur * 0.45, dur * 0.78];
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const frames = [];
          for (let i = 0; i < times.length; i++) {
            await new Promise((res) => {
              vid.onseeked = () => res();
              vid.currentTime = Math.min(dur - 0.1, times[i]);
            });
            const w = 640;
            const h = Math.round((vid.videoHeight / Math.max(1, vid.videoWidth)) * 640) || 360;
            canvas.width = w; canvas.height = h;
            ctx.drawImage(vid, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            frames.push({ label: fmtSecs(times[i]), dataUrl });
          }
          URL.revokeObjectURL(url);
          resolve({ durationSec: dur, width: vid.videoWidth, height: vid.videoHeight, frames });
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      vid.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode video file locally in browser.')); };
    });
  }

  async function compressToYouTubeThumbnailJpeg(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1280; canvas.height = 720;
        const ctx = canvas.getContext('2d');
        // Cover crop to crisp 16:9 1280x720
        const scale = Math.max(1280 / img.width, 720 / img.height);
        const nw = img.width * scale, nh = img.height * scale;
        ctx.drawImage(img, (1280 - nw) / 2, (720 - nh) / 2, nw, nh);
        let q = 0.90;
        let out = canvas.toDataURL('image/jpeg', q);
        while (out.length * 0.75 > 1900000 && q > 0.4) {
          q -= 0.1;
          out = canvas.toDataURL('image/jpeg', q);
        }
        resolve(out);
      };
      img.onerror = () => reject(new Error('Invalid image data'));
      img.src = dataUrl;
    });
  }

  async function imageUrlToInlineData(urlOrDataUrl) {
    if (urlOrDataUrl.startsWith('data:')) {
      const [head, b64] = urlOrDataUrl.split(',');
      const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
      return { mimeType: mime, data: b64 };
    }
    const resp = await fetch(urlOrDataUrl);
    const blob = await resp.blob();
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => {
        const [, b64] = r.result.split(',');
        resolve({ mimeType: blob.type || 'image/jpeg', data: b64 });
      };
      r.readAsDataURL(blob);
    });
  }

  async function generateNanoBananaThumbnail({ title, description, extraPrompt, frameDataUrls }) {
    const key = (State.prefs.geminiApiKey || '').trim();
    if (!key) throw new Error('Set your Gemini API Key in Setup & Settings first.');

    // Rate-limit protection: 1) Check exact prompt+frames hash cache in sessionStorage, 2) 6s cooldown!
    const now = Date.now();
    const cooldownLeft = 6000 - (now - State.auth.lastGeminiCallAt);
    if (cooldownLeft > 0) {
      throw new Error(`Rate-limit guard: wait ${Math.ceil(cooldownLeft / 1000)}s before calling Gemini again.`);
    }

    const hashKey = btoa(unescape(encodeURIComponent((title || '') + '|' + (extraPrompt || '') + '|' + (frameDataUrls || []).map(x => x.slice(-40)).join(',')))).slice(0, 48);
    const cached = safeJsonParse(sessionStorage.getItem('gem_thumb_' + hashKey), null);
    if (cached && cached.imageDataUrl) {
      toast('Returned identical thumbnail from local cache (0 Gemini API quota spent!).', 'ok');
      return cached;
    }

    const parts = [];
    for (const src of (frameDataUrls || []).slice(0, 3)) {
      try {
        const inlineData = await imageUrlToInlineData(src);
        parts.push({ inlineData });
      } catch (e) { console.warn('Skipped frame attach:', e); }
    }

    const promptText = [
      `Create a high-click-through 16:9 YouTube thumbnail using Nano Banana 2 Lite visual composition.`,
      `CRITICAL INSTRUCTION: Directly incorporate recognizable subjects, props, faces, color palette, and visual elements taken from the attached video frame(s) so the thumbnail genuinely reflects the actual video content.`,
      `Video Title: "${title || 'Untitled Video'}"`,
      description ? `Video Context: "${description.slice(0, 280)}"` : '',
      extraPrompt ? `Creator Direction: ${extraPrompt}` : '',
      `Style guidelines: bold focal subject from the video frames, dramatic lighting/contrast, clean silhouette separation, expressive composition, crisp readable framing without clutter or tiny illegible text.`
    ].filter(Boolean).join('\n');

    parts.push({ text: promptText });

    State.auth.lastGeminiCallAt = Date.now();
    toast('Calling Gemini Nano Banana 2 Lite (High Thinking, 1 single request)...', 'info', 4500);

    const res = await fetch(GEMINI_NANO_BANANA_2_LITE, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': key
      },
      body: JSON.stringify({
        contents: [{ role: 'user', parts }],
        generationConfig: {
          responseModalities: ['TEXT', 'IMAGE'],
          imageConfig: { aspectRatio: '16:9', imageSize: '1K' },
          thinkingConfig: { thinkingLevel: 'HIGH' }
        }
      })
    });

    const json = await res.json().catch(() => null);
    if (!res.ok) {
      throw new Error(json?.error?.message || `Gemini HTTP ${res.status}`);
    }

    const outParts = json?.candidates?.[0]?.content?.parts || [];
    let rawImageDataUrl = null;
    const notes = [];
    for (const p of outParts) {
      if (p.inlineData?.data && !p.thought) {
        rawImageDataUrl = `data:${p.inlineData.mimeType || 'image/png'};base64,${p.inlineData.data}`;
      } else if (p.inlineData?.data && !rawImageDataUrl) {
        rawImageDataUrl = `data:${p.inlineData.mimeType || 'image/png'};base64,${p.inlineData.data}`;
      } else if (p.text && !p.thought) {
        notes.push(p.text);
      }
    }
    if (!rawImageDataUrl) throw new Error('Gemini returned no image part. ' + notes.join(' '));

    const ytReadyDataUrl = await compressToYouTubeThumbnailJpeg(rawImageDataUrl);
    const result = { imageDataUrl: ytReadyDataUrl, notes: notes.join('\n') };
    try { sessionStorage.setItem('gem_thumb_' + hashKey, JSON.stringify(result)); } catch {}
    return result;
  }

  /* ==========================================================================
     10. SVG CHART RENDERERS (TIME SERIES, MULTI-LINE, LIVE GRANULAR + REMOVED)
     ========================================================================== */
  function buildLineChartSvg(container, { series, labels, height = 220, formatVal = fmtNum, markers = [] }) {
    if (!series.length || !labels.length) {
      container.innerHTML = '<div class="muted small">No chart points available for this selection.</div>';
      return;
    }
    const W = 740, H = height, PL = 48, PR = 16, PT = 14, PB = 26;
    const plotW = W - PL - PR, plotH = H - PT - PB;
    const allVals = series.flatMap(s => s.values.filter(v => Number.isFinite(v)));
    let minV = Math.min(...allVals, 0);
    let maxV = Math.max(...allVals, 1);
    if (minV > 0 && series.some(s => s.tightY)) minV = Math.floor(minV * 0.96);
    const span = Math.max(1e-6, maxV - minV);

    const xOf = (i) => PL + (labels.length === 1 ? plotW / 2 : (i / (labels.length - 1)) * plotW);
    const yOf = (v) => PT + plotH - ((v - minV) / span) * plotH;

    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const val = minV + (span * g) / 4;
      const y = yOf(val);
      grid += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3,3" stroke-width="1"/>`;
      grid += `<text x="${PL - 6}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10">${esc(formatVal(Math.round(val * 100) / 100))}</text>`;
    }

    const stepX = Math.max(1, Math.ceil(labels.length / 7));
    let xTicks = '';
    for (let i = 0; i < labels.length; i += stepX) {
      const x = xOf(i);
      xTicks += `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="10">${esc(labels[i])}</text>`;
    }

    let paths = '';
    series.forEach((s) => {
      const pts = s.values.map((v, i) => Number.isFinite(v) ? [i, xOf(i), yOf(v), v] : null).filter(Boolean);
      if (!pts.length) return;
      const d = pts.map((p, idx) => `${idx === 0 ? 'M' : 'L'}${p[1].toFixed(1)},${p[2].toFixed(1)}`).join(' ');
      if (s.area) {
        const areaD = `${d} L${pts[pts.length - 1][1].toFixed(1)},${(PT + plotH).toFixed(1)} L${pts[0][1].toFixed(1)},${(PT + plotH).toFixed(1)} Z`;
        paths += `<path d="${areaD}" fill="${s.color}" opacity="0.14"/>`;
      }
      paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" ${s.dashed ? 'stroke-dasharray="5,4"' : ''}/>`;
      pts.forEach(p => {
        paths += `<circle class="pt-dot" data-idx="${p[0]}" cx="${p[1].toFixed(1)}" cy="${p[2].toFixed(1)}" r="${pts.length > 40 ? 2.4 : 3.6}" fill="${s.color}"/>`;
      });
    });

    // Removed / Audit-Drop sample markers overlay!
    let markerSvg = '';
    markers.forEach(m => {
      const x = xOf(m.index), y = yOf(m.value);
      markerSvg += `
        <g class="removed-marker" data-idx="${m.index}">
          <line x1="${x}" y1="${PT}" x2="${x}" y2="${PT + plotH}" stroke="${m.color}" stroke-dasharray="2,2" opacity="0.55"/>
          <circle cx="${x}" cy="${y}" r="5.5" fill="var(--bg)" stroke="${m.color}" stroke-width="2"/>
          <text x="${x}" y="${y + 3}" text-anchor="middle" fill="${m.color}" font-size="9" font-weight="700">✕</text>
        </g>`;
    });

    container.innerHTML = `
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${height}px">
        ${grid}${xTicks}${paths}${markerSvg}
        <rect class="hover-pad" x="${PL}" y="${PT}" width="${plotW}" height="${plotH}" fill="transparent"/>
      </svg>
      <div class="chart-tooltip"></div>
    `;

    const svg = container.querySelector('svg');
    const tip = container.querySelector('.chart-tooltip');
    svg.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * W;
      const frac = Math.max(0, Math.min(1, (relX - PL) / Math.max(1, plotW)));
      const idx = Math.round(frac * (labels.length - 1));
      const lines = [`<strong>${esc(labels[idx])}</strong>`];
      series.forEach(s => {
        const val = s.values[idx];
        if (Number.isFinite(val)) {
          lines.push(`<span style="color:${s.color}">●</span> ${esc(s.name)}: <strong>${esc(formatVal(val))}</strong>`);
        }
      });
      const mk = markers.find(m => m.index === idx);
      if (mk) lines.push(`<span style="color:${mk.color}">⚠ ${esc(mk.label)}</span>`);
      tip.innerHTML = lines.join('<br>');
      tip.style.display = 'block';
      tip.style.left = Math.min(container.clientWidth - 190, Math.max(8, e.clientX - rect.left + 12)) + 'px';
      tip.style.top = Math.max(6, e.clientY - rect.top - 36) + 'px';
    });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  }

  /* ==========================================================================
     11. MULTI-PANE & TAB WORKSPACE MANAGER (UP TO 5 SPLITS)
     ========================================================================== */
  function getPane(paneId) {
    return State.workspace.panes.find(p => p.id === paneId) || State.workspace.panes[0];
  }
  function getActiveTab(pane) {
    return pane.tabs.find(t => t.id === pane.activeTabId) || pane.tabs[0];
  }
  function setLayoutMode(layoutCode) {
    const targetCount = layoutCode === '2v' ? 2 : Number(layoutCode);
    State.workspace.layout = String(layoutCode);
    while (State.workspace.panes.length < targetCount) {
      const n = State.workspace.panes.length + 1;
      const defaultViews = ['videos', 'analytics', 'comments', 'overview', 'write_queue'];
      const v = defaultViews[(n - 1) % defaultViews.length];
      const pid = 'p' + Date.now().toString(36) + n;
      const tid = 't' + Date.now().toString(36) + n;
      State.workspace.panes.push({
        id: pid,
        activeTabId: tid,
        tabs: [{ id: tid, view: v, title: VIEW_META[v].label, params: {} }]
      });
    }
    while (State.workspace.panes.length > targetCount) {
      State.workspace.panes.pop();
    }
    if (!State.workspace.panes.some(p => p.id === State.workspace.focusedPaneId)) {
      State.workspace.focusedPaneId = State.workspace.panes[0].id;
    }
    saveWorkspace();
    renderWorkspace();
  }

  function addSplitPane(view = 'analytics', params = {}) {
    if (State.workspace.panes.length >= 5) {
      toast('Max 5 simultaneous splits reached! Override a pane tab or close one first.', 'warn');
      return;
    }
    const nextCount = State.workspace.panes.length + 1;
    const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
    const tid = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
    State.workspace.panes.push({
      id: pid, activeTabId: tid,
      tabs: [{ id: tid, view, title: params.title || VIEW_META[view]?.label || view, params }]
    });
    State.workspace.layout = String(nextCount);
    State.workspace.focusedPaneId = pid;
    saveWorkspace();
    renderWorkspace();
  }

  function closePane(paneId) {
    if (State.workspace.panes.length <= 1) {
      toast('Cannot close the last remaining pane.', 'warn');
      return;
    }
    State.workspace.panes = State.workspace.panes.filter(p => p.id !== paneId);
    State.workspace.layout = String(State.workspace.panes.length);
    if (State.workspace.focusedPaneId === paneId) {
      State.workspace.focusedPaneId = State.workspace.panes[0].id;
    }
    saveWorkspace();
    renderWorkspace();
  }

  function openViewInFocusedPane(view, params = {}, asNewTab = false) {
    const pane = getPane(State.workspace.focusedPaneId);
    const title = params.title || VIEW_META[view]?.label || view;
    if (asNewTab) {
      const tid = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
      pane.tabs.push({ id: tid, view, title, params });
      pane.activeTabId = tid;
    } else {
      const tab = getActiveTab(pane);
      tab.view = view;
      tab.title = title;
      tab.params = params;
    }
    saveWorkspace();
    renderWorkspace();
  }

  function openViewInPane(paneId, view, params = {}, asNewTab = false) {
    State.workspace.focusedPaneId = paneId;
    openViewInFocusedPane(view, params, asNewTab);
  }

  /* ==========================================================================
     12. VIEW RENDERERS
     ========================================================================== */
  function renderViewInto(bodyEl, pane, tab) {
    const view = tab.view;
    if (view === 'overview') return renderOverviewView(bodyEl, pane, tab);
    if (view === 'videos') return renderVideosView(bodyEl, pane, tab);
    if (view === 'video_editor') return renderVideoEditorView(bodyEl, pane, tab);
    if (view === 'upload') return renderUploadView(bodyEl, pane, tab);
    if (view === 'analytics') return renderAnalyticsView(bodyEl, pane, tab);
    if (view === 'comments') return renderCommentsView(bodyEl, pane, tab);
    if (view === 'write_queue') return renderWriteQueueView(bodyEl, pane, tab);
    if (view === 'accounts_settings') return renderAccountsSettingsView(bodyEl, pane, tab);
    bodyEl.innerHTML = `<div class="card">Unknown view: ${esc(view)}</div>`;
  }
